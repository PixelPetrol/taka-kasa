.np-tile-label{overflow-wrap:normal}
.np-tile-label.tr > span{display:none}
.np-tile-label.tr::after{content:attr(data-trunc)}
/* Klawisz F: cyfry pokazują przypisane funkcje */
.np-key.k-fx{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;padding:10px 12px;color:#fff;text-align:left;background:var(--np-gray);position:relative}
.np-key.k-fx .np-ico{position:absolute;top:10px;right:10px;width:24px;height:24px;opacity:.9}
.np-key-fn{position:absolute;top:9px;left:12px;font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));font-weight:600;opacity:.8}
.np-key-fl{font-size:calc(17px * var(--np-ts,1));font-weight:600;line-height:1.12;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.np-key.k-fx.empty{background:var(--np-surface-2);color:var(--np-ink-3);box-shadow:inset 0 0 0 1.5px dashed var(--np-hair-2)}
.np-key.f-on{background:var(--np-blue);color:#fff}
.np-key.f-dim{opacity:.35}
.np-key.f-edit{background:var(--np-ink);color:var(--np-on-ink)}

/* Menu na pełnym ekranie (Tweak „Menu na pełnym ekranie”) — zakrywa sekcję paragonu */
.np-sale.menu-full,.np-sale.rl.menu-full{grid-template-columns:minmax(0,1fr)}
.np-sale.menu-full > .np-right{display:none}
.np-sale.menu-full .np-tabs{align-self:flex-start;width:calc(100% - clamp(400px,39.8%,560px) - 12px)}
.np-sale.rl.menu-full .np-tabs{align-self:flex-end}
.np-sale.menu-full .np-menu,.np-sale.rl.menu-full .np-menu{grid-template-columns:minmax(0,1fr) clamp(200px,22%,260px)}
.np-sale.menu-full .np-menu > .np-side{order:2}
.np-sale.menu-full .np-menu-grid.sq{grid-template-columns:repeat(6,minmax(0,1fr))}
/* Paragon nieaktywny: menu obok paragonu lub użytkownik bez uprawnień do sprzedaży */
.np-sale.rcpt-off > .np-right{opacity:.38;filter:grayscale(1);pointer-events:none;user-select:none;transition:opacity .15s var(--np-ease)}

/* Klawiatura ekranowa — standardowy QWERTY, większe klawisze, Shift, ?123, polskie znaki po przytrzymaniu */
.np-osk{position:relative;gap:7px;padding:10px}
.np-osk-row{gap:7px}
.np-osk-k{position:relative;max-width:104px;height:54px;font-size:calc(21px * var(--np-ts,1));touch-action:none}
.np-osk-k.wide{flex:1.5 1 0;max-width:160px}
.np-osk-k.space{flex:5 1 0}
.np-osk-k.on{background:var(--np-ink);color:var(--np-on-ink)}
.np-osk-k svg{display:block}
.np-osk-acc{position:absolute;top:4px;right:7px;font-style:normal;font-size:calc(11px * var(--np-ts,1));line-height:1;color:var(--np-ink-3)}
.np-osk-pop{position:absolute;z-index:6;display:flex;gap:4px;padding:5px;border-radius:13px;background:var(--np-surface);box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 1px var(--np-hair);transform:translate(-50%,calc(-100% - 6px));animation:np-fadein .1s var(--np-ease)}
.np-osk-pop span{min-width:var(--kw);height:58px;display:grid;place-items:center;border-radius:9px;font-size:calc(25px * var(--np-ts,1));font-weight:500}
.np-osk-pop span.on{background:var(--np-blue);color:#fff}

/* Karta towaru: kody dodatkowe, SUP/DRS, większe opisy */
.np-pe-xcs{display:flex;flex-direction:column;gap:8px}
.np-pe-xc{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) 92px 46px;grid-template-areas:"n code code x" ". price mult mult" ". err err err";row-gap:6px;padding-bottom:4px;border-bottom:1px solid var(--np-hair);align-items:center;gap:8px}
.np-pe-xc > .np-pe-err{grid-column:2/-1}
.np-pe-xc-n{width:28px;height:28px;border-radius:50%;background:var(--np-surface-2);display:grid;place-items:center;font-size:calc(13px * var(--np-ts,1));font-weight:650;color:var(--np-ink-2)}
.np-pe-xc-f{display:flex;align-items:center;gap:6px;min-width:0}
.np-pe-xc-f .np-pe-in{flex:1;min-width:0}
.np-pe-xc-f em{font-style:normal;font-size:calc(14px * var(--np-ts,1));font-weight:600;color:var(--np-ink-3)}
.np-pe-xc-x{height:46px;border-radius:11px;background:var(--np-surface-2);color:var(--np-red);display:grid;place-items:center}
.np-pe-xc-x .np-ico{width:20px;height:20px}
.np-pe-addcode{grid-column:1/-1;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--np-hair);font-size:calc(15px * var(--np-ts,1));font-weight:600;color:var(--np-blue)}
.np-pe-addcode .np-ico{width:20px;height:20px}
.np-pe-addcode:active{background:var(--np-surface-2)}
.np-pe-supdrs > span{display:flex;align-items:center;gap:8px}
.np-pe-supdrs > span .np-ico{color:var(--np-green)}
.np-supdrs{width:min(560px,calc(100% - 40px))}
.np-supdrs-body{display:flex;flex-direction:column;gap:14px}
.np-supdrs-sec{display:flex;flex-direction:column;gap:8px}
.np-supdrs-h{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.np-supdrs-h b{font-size:calc(15px * var(--np-ts,1));font-weight:650}
.np-supdrs-h small{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-2)}
.np-supdrs .np-choices{margin-top:0}
.np-supdrs > .np-btn{height:54px;flex:none}
.np-pe-descs{gap:8px}
.np-pe-descs .np-pe-in{height:54px;font-size:calc(17px * var(--np-ts,1))}

/* ═══ Tryb gastro ═══ */
.np-gv{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.np-gkrow{flex:0 0 calc((100% - 26px - 8px * 6) / 5)}
.np-gbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.np-dots.gastro i{background:var(--npd-orange-t,rgba(242,128,31,.3))}
.np-dots.gastro button.on i{background:var(--np-orange)}
.np-sum-no.place{color:var(--npd-orange-i,#A54708);font-weight:650;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* siatka stolików */
.np-gtgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
.np-gt{position:relative;min-width:0;min-height:0;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.np-gt.none{background:transparent;box-shadow:none}
.np-gt:active{transform:scale(.97)}
.np-gt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;min-width:0}
.np-gt-l{min-width:0;display:flex;flex-direction:column;gap:3px}
.np-gt-l b{font-size:calc(24px * var(--np-ts,1));font-weight:650;line-height:1}
.np-gt-l small{font-size:calc(13px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gt.free .np-gt-l b,.np-gt.free .np-gt-l small{color:var(--np-ink-3)}
.np-gt.free .np-gt-l small{font-weight:500}
.np-gt-bt{display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.np-gt-bt span{display:flex;flex-direction:column}
.np-gt-bt small{font-size:calc(12px * var(--np-ts,1));color:var(--np-ink-2);line-height:1.25}
.np-gt-bt b{font:600 calc(15px * var(--np-ts,1)) var(--np-mono,"Geist Mono",monospace)}
.np-gt.open{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-gt.busy{background:var(--npd-orange-t,#FDEBDC)}
.np-gt.busy .np-gt-bt b{color:var(--npd-orange-i,#A54708)}
.np-gt.late{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-gt.cur{background:var(--np-orange);color:#fff}
.np-gt.cur .np-gt-bt small,.np-gt.cur .np-gt-bt b{color:#fff}
.np-gw{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
/* plan sali */
.np-fp{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-fp-cell{border-radius:8px;border:1.5px dashed var(--np-hair-2,rgba(0,0,0,.12))}
.np-fp-cell:active{background:var(--npd-fill,rgba(0,0,0,.05))}
.np-fx{margin:6px;border-radius:10px;display:grid;place-items:center;font-size:calc(11.5px * var(--np-ts,1));font-weight:700;letter-spacing:.08em;color:var(--np-ink-3);pointer-events:none}
.np-fx.bar{background:var(--np-surface-2);color:var(--np-ink-2)}
.np-fx.zone{margin:0;border-top:2px dashed var(--np-hair-2,rgba(0,0,0,.14));border-radius:0;place-items:start;padding:6px 4px 0}
.np-fx.door{border:1.5px dashed var(--np-ink-3)}
.np-fi{position:relative;min-width:0;min-height:0;padding:10px;z-index:1}
.np-fi.round{display:flex;align-items:center;padding:4px;container-type:size}
.np-rnd{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;margin:auto}
.np-ftb{position:relative;z-index:1;width:100%;height:100%;border-radius:12px;background:var(--np-surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;overflow:hidden;padding:0 4px}
.np-rnd .np-ftb{position:absolute;inset:9px;width:auto;height:auto;border-radius:50%}
.np-ftb b{font-size:calc(19px * var(--np-ts,1));font-weight:650;line-height:1}
.np-ftb small{font-size:calc(11.5px * var(--np-ts,1));font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ftb em{font:600 calc(12.5px * var(--np-ts,1)) var(--np-mono,"Geist Mono",monospace);font-style:normal}
.np-ftb.free b{color:var(--np-ink-3)}
.np-ftb.open{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-ftb.busy{background:var(--npd-orange-t,#FDEBDC);box-shadow:inset 0 0 0 2px var(--np-orange)}
.np-ftb.late{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-ftb.cur{background:var(--np-orange);color:#fff}
.np-fi > .np-gw,.np-rnd > .np-gw{position:absolute;top:2px;right:2px;z-index:2;width:20px;height:20px;font-size:8.5px;box-shadow:0 0 0 2px var(--np-surface)}
.np-rnd > .np-gw{top:-4px;right:-4px}
.np-ch{position:absolute;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair-2,rgba(0,0,0,.1));border-radius:4px}
.np-ch.hz{width:18px;height:7px}.np-ch.vt{width:7px;height:18px}.np-ch.r{width:18px;height:7px;border-radius:4px}
.np-fi.busy .np-ch{background:var(--np-ink-3)}
.np-fp.edit .np-fi{z-index:2}
.np-fi.sel{outline:2.5px solid var(--np-blue);outline-offset:-2px;border-radius:10px}
.np-fp-tools{display:flex;align-items:center;gap:6px}
.np-fp-s{font-size:calc(14px * var(--np-ts,1));font-weight:600;min-width:44px;text-align:center}
/* rachunki otwarte */
.np-gbills{flex:1;min-height:0}
.np-gbills > .np-sa-in,.np-gbills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:118px;gap:8px;align-content:start}
.np-gb{min-width:0;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.np-gb.cur{background:var(--npd-orange-t,#FDEBDC);box-shadow:inset 0 0 0 2px var(--np-orange)}
.np-gb-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.np-gb-h > b{font-size:calc(16px * var(--np-ts,1));font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gb-tag{flex:none;min-width:52px;height:42px;padding:0 8px;border-radius:9px;background:var(--np-red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.np-gb-tag b{font-size:18px}.np-gb-tag small{font-size:10px;font-weight:600;margin-top:2px}
.np-gb-tag.no{background:var(--np-surface-2);color:var(--np-ink-2)}
.np-gb-m{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gb-f{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.np-gb-f small{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-2)}
.np-gb-f b{font:600 calc(17px * var(--np-ts,1)) var(--np-mono,"Geist Mono",monospace)}
.np-gempty{flex:1;display:grid;place-items:center;padding:40px;text-align:center;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-3);text-wrap:pretty}
/* opis stolika */
.np-gdesc{width:min(1000px,calc(100% - 24px));display:flex;flex-direction:column;gap:12px}
.np-gdesc-fld{height:62px;border-radius:14px;background:var(--np-surface-2);box-shadow:inset 0 0 0 2px var(--np-blue);display:flex;align-items:center;padding:0 18px;font-size:calc(23px * var(--np-ts,1));font-weight:550}
.np-gdesc-fld .ph{color:var(--np-ink-3);font-weight:400}
.np-gdesc-fld i{width:2px;height:28px;background:var(--np-blue);margin-left:2px;animation:np-fade .6s steps(1) infinite alternate}
.np-gdesc-sugg{display:flex;flex-wrap:wrap;gap:8px}
.np-gdesc-sugg button{height:40px;padding:0 16px;border-radius:20px;background:var(--np-surface-2);font-size:calc(15px * var(--np-ts,1));font-weight:550}
.np-gdesc-g{display:flex;align-items:center;gap:10px;font-size:calc(15px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-gdesc-g span{margin-right:auto}
.np-gdesc-g button{width:52px;height:46px;border-radius:12px;background:var(--np-surface-2);display:grid;place-items:center}
.np-gdesc-g b{min-width:48px;text-align:center;font:600 24px var(--np-mono,"Geist Mono",monospace);color:var(--np-ink)}
/* podział rachunku */
.np-gsplit{width:min(1180px,calc(100% - 24px));height:min(720px,calc(100% - 24px));display:flex;flex-direction:column;gap:14px}
.np-gsplit-h{display:flex;align-items:baseline;gap:16px}
.np-gsplit-h > span{font-size:calc(14.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-gsplit-b{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.np-gsplit-list{min-height:0}
.np-gsi{display:grid;grid-template-columns:40px minmax(0,1fr) 170px 90px;align-items:center;gap:12px;min-height:60px;padding:0 12px;border-radius:12px;background:var(--np-surface-2);margin-bottom:6px}
.np-gsi.on{background:var(--npd-blue-t,#E9F1FF);box-shadow:inset 0 0 0 1.5px var(--np-blue)}
.np-gsi-cb{width:34px;height:34px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--np-ink-3);display:grid;place-items:center;font-size:17px;font-weight:700}
.np-gsi.on .np-gsi-cb{background:var(--np-blue);box-shadow:none;color:#fff}
.np-gsi-cb .np-ico{width:18px;height:18px}
.np-gsi-n{min-width:0}
.np-gsi-n b{display:block;font-size:calc(15.5px * var(--np-ts,1));font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gsi-n small{font-size:calc(12.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-gsi-q{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:10px;background:var(--npd-btn,#fff);padding:0 4px}
.np-gsi-q.none{background:transparent}
.np-gsi-q button{width:40px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--np-surface-2)}
.np-gsi-q b{font:600 14.5px var(--np-mono,"Geist Mono",monospace)}
.np-gsi-v{text-align:right;font:600 15px var(--np-mono,"Geist Mono",monospace)}
.np-gsplit-side{display:flex;flex-direction:column;gap:10px;min-height:0}
.np-gsplit-tot{border-radius:16px;background:var(--np-surface-2);padding:16px;display:flex;flex-direction:column;gap:10px}
.np-gsplit-tot > div{display:flex;justify-content:space-between;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}
.np-gsplit-tot > div b{font:600 15px var(--np-mono,"Geist Mono",monospace);color:var(--np-ink)}
.np-gsplit-tot > div.big{padding-top:10px;border-top:1px solid var(--np-hair);align-items:baseline;color:var(--np-ink);font-weight:600}
.np-gsplit-tot > div.big b{font-size:36px}
.np-gsplit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.np-gsplit-side .np-btn{height:54px}
.np-gsplit-side .np-btn.big{height:68px;font-size:calc(18px * var(--np-ts,1))}

/* ═══ Plan sali — edytor ═══ */
.np-pagebar-name.warn{color:var(--np-blue);font-weight:650}
.np-pagebar-tip{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-fp.edit .np-fx{pointer-events:auto;touch-action:none;cursor:grab;position:relative;z-index:2}
.np-fp.edit .np-fi{touch-action:none;cursor:grab}
.np-fx.wall{margin:auto 4px;height:10px;align-self:center;background:var(--np-ink-3);border-radius:5px}
.np-fx.sel,.np-fi.sel{outline:2.5px solid var(--np-blue);outline-offset:-1px;border-radius:10px}
.np-fx.drag,.np-fi.drag{opacity:.3}
.np-fp-prev{z-index:5;margin:3px;border-radius:12px;background:rgba(34,191,111,.22);box-shadow:inset 0 0 0 2.5px var(--np-green);pointer-events:none}
.np-fp-prev.bad{background:rgba(239,66,25,.2);box-shadow:inset 0 0 0 2.5px var(--np-red)}
.np-ftb-s{color:var(--np-ink-3)!important;font-weight:500!important}
.np-pled{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--np-bg);animation:np-fade .15s var(--np-ease)}
.np-pled-head{flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.np-pled-rooms{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--np-surface);box-shadow:var(--np-shadow-1);min-width:0;overflow-x:auto}
.np-pled-rooms button{flex:none;height:44px;padding:0 16px;border-radius:11px;display:flex;align-items:center;gap:8px;font-size:calc(15.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-pled-rooms button small{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--np-surface-2);display:grid;place-items:center;font-size:12px}
.np-pled-rooms button.on{background:var(--np-ink);color:var(--np-on-ink)}
.np-pled-rooms button.on small{background:rgba(255,255,255,.2);color:inherit}
.np-pled-rooms button.add{color:var(--np-blue)}
.np-pled-rooms .np-ico{width:18px;height:18px}
.np-pled-act{display:flex;align-items:center;gap:8px;flex:none}
.np-pled-act .np-btn{height:50px;padding:0 22px}
.np-pled-act .np-pill-btn{height:40px}
.np-pled-act .np-pill-btn:disabled{opacity:.4}
.np-pled-body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px}
.np-pled-pal,.np-pled-props{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-1);min-height:0}
.np-pled-pal h6,.np-pled-props h6{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--np-ink-3);padding:4px 4px 6px}
.np-pled-props h6 em{font-style:normal;text-transform:none;letter-spacing:0;font-size:12px;color:var(--npd-orange-i,#A54708)}
.np-pled-pe{flex:1;min-height:0;max-height:66px;border-radius:12px;background:var(--np-surface-2);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:calc(14.5px * var(--np-ts,1));font-weight:600;text-align:left;touch-action:none}
.np-pled-pe.on{background:var(--npd-blue-t,#E9F1FF);box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-pled-pe i{flex:none;width:34px;height:24px;border-radius:6px;background:var(--np-ink-3)}
.np-pled-pe i.pi-r{width:26px;height:26px;border-radius:50%}
.np-pled-pe i.pi-q{width:24px;height:24px}
.np-pled-pe i.pi-l{width:38px;height:20px}
.np-pled-pe i.pi-q2{width:30px;height:30px}

--npd-tint:255,255,255;--npd-press:#313338;--npd-fill:rgba(255,255,255,.06);--npd-btn:#2E3035;--npd-switch:#3A3C42;--npd-track:#2C2E33;--npd-off:#26282D;--npd-rm:#5B5E65;--npd-dot:#3B3E45;--npd-osk:#141518;--npd-osk-k:#34363C;--npd-osk-alt:#25272B;--npd-osk-on:#4B4E55;--npd-sheet:#17181B;--npd-scrim:rgba(0,0,0,.52);--npd-frost-bg:rgba(11,12,14,.55);--npd-frost:rgba(30,31,35,.86);--npd-toast:rgba(56,58,64,.96);--npd-key-sh:rgba(0,0,0,.45);--npd-focus:#33353B;--npd-hero:#0B0C0E;--npd-on-ink-2:rgba(17,18,21,.6);--npd-seg-on:#3E4046;--npd-swatch-ring:rgba(255,255,255,.1);--npd-tile-sh:inset 0 1px 0 rgba(255,255,255,.07);--npd-qb-sh:0 0 0 1px rgba(255,255,255,.06);--npd-mark:rgba(255,204,0,.32);--npd-flash:rgba(34,191,111,.32);
--npd-green-t:rgba(34,191,111,.17);--npd-green-i:#5BDE9C;--npd-green-t2:rgba(91,222,156,.14);--npd-orange-t:rgba(242,128,31,.17);--npd-orange-i:#FFAD69;--npd-red-t:rgba(240,70,30,.17);--npd-red-i:#FF8B70;--npd-red-t2:rgba(240,70,30,.3);--npd-blue-t:rgba(43,138,255,.17);--npd-blue-i:#7DB5FF;--npd-blue-t2:rgba(125,181,255,.14);--npd-amber-t:rgba(242,160,40,.13);--npd-amber-b:rgba(242,160,40,.5);--npd-amber-i:#FFC266}
html.np-dark,html.np-dark body{background:#FFFFFF} /* podłoże za ramką kasy zawsze białe */
html.np-dark body.np-bare{background:var(--np-bg)}
.np-dark .np-screen{color-scheme:dark}
.np-dark .np-device:not(.bare){box-shadow:inset 0 0 0 1.5px #2a2c31,inset 0 2px 0 #3b3d43,0 0 0 1px rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.5)}
/* Arkusze i dialogi: powierzchnie o stopień jaśniejsze niż ekran pod spodem */
.np-dark .np-sheet,.np-dark .np-fsheet,.np-dark .np-pe-pickbox{--np-surface:#232529;--np-surface-2:#2D2F34;--npd-press:#393B41;--npd-btn:#35373D;--npd-seg-on:#45474D}
.np-dark .np-pay-total{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.np-dark .np-razem:disabled{color:rgba(255,255,255,.3)}
/* Płynne przejście przy zmianie motywu */
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
</style>
<style>/* KASA NEXT MAX — motyw „Beauty” (jasny róż). Klasa np-beauty na <html>; nadpisuje zmienne motywu jasnego. */
html.np-beauty{--np-bg:#F5DFE8;--np-surface:#FFFFFF;--np-surface-2:#FCF1F5;--np-ink:#2A1720;--np-ink-2:#6E5560;--np-ink-3:#A68E98;--np-hair:rgba(120,30,70,.09);--np-hair-2:rgba(120,30,70,.16);--np-gray:#8A6F7B;--np-graphite:#4A2E3B;--np-blue:#D6457A;--np-teal:#B0577E;--np-teal-900:#5A1E39;
--npd-blue-t:#FCE3EC;--npd-blue-i:#A8285A;--npd-sel:rgba(214,69,122,.14);--npd-sel-b:rgba(214,69,122,.55);--npd-sel-i:#A8285A;--npd-osk:#F1D9E3;--npd-osk-k:#FFFFFF;--npd-osk-alt:#E6C4D2;--npd-sheet:#FDF4F7;--npd-track:#F1D9E3;--npd-seg-on:#FFFFFF;--npd-focus:rgba(214,69,122,.35);

<style>/* KASA NEXT PRO — Programowanie (tabele, formularze) */
.np-prog .np-subhead{gap:10px}
.np-prog .np-subhead .np-pill-btn.ink{height:40px;padding:0 16px 0 12px;font-size:calc(15.5px * var(--np-ts,1))}
.np-prog-tabs{width:320px}
.np-prog-tabs button{height:36px}
.np-tbl{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow:hidden}
.np-tbl-h{flex:none;display:grid;align-items:center;gap:14px;height:44px;padding:0 18px;border-bottom:1px solid var(--np-hair);font-size:calc(12.5px * var(--np-ts,1));font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-tbl-b{flex:1;min-height:0;padding:2px 8px 6px}
.np-tbl-r{width:100%;display:grid;align-items:center;gap:14px;min-height:62px;padding:8px 10px;border-radius:12px;text-align:left;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-2)}
.np-tbl-r + .np-tbl-r{box-shadow:0 -1px 0 var(--np-hair)}
.np-tbl-r:active{background:var(--np-surface-2)}
.np-tbl-r.ro:active{background:transparent}
.np-tbl-r > .np-ico{width:18px;height:18px;color:var(--np-ink-3)}
.np-tbl-r > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tbl-r > span.main{color:var(--np-ink)}
.np-tbl-r > span b{font-size:calc(17px * var(--np-ts,1));font-weight:600;color:var(--np-ink)}
.np-tbl-r > span small{display:block;margin-top:2px;font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-3);overflow:hidden;text-overflow:ellipsis}
.np-tbl-r > span em{font-style:normal;color:var(--np-ink-3)}
.np-tbl-h .r,.np-tbl-r .r{text-align:right}
.np-tbl-h .c,.np-tbl-r .c{text-align:center;justify-self:center}
.np-tbl-r .mono{font-family:var(--np-mono);font-variant-numeric:tabular-nums;font-size:calc(15.5px * var(--np-ts,1))}
.np-tbl-empty{padding:48px 20px;text-align:center;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-3)}
.np-tbl-ok{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--npd-green-t,#E3F7EC);color:var(--np-green-700)}
.np-tbl-ok .np-ico{width:18px;height:18px}.np-tbl-ok .np-ico svg{stroke-width:3}
.np-tbl-no{color:var(--np-ink-3)}
.np-tbl-ico{display:flex !important;align-items:center;gap:12px}
.np-tbl-ico > i{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink)}
.np-tbl-ico > i .np-ico{width:22px;height:22px}
.np-tbl-ord{display:inline-flex !important;gap:6px}
.np-tbl-ord > i{width:44px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink)}
.np-tbl-ord > i:active{background:var(--np-hair-2)}
.np-tbl-ord .np-ico{width:20px;height:20px}
.np-tbl-pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:calc(14px * var(--np-ts,1));font-weight:600;background:var(--np-surface-2);color:var(--np-ink)}
.np-tbl-pill.p-nadzorca{background:var(--npd-blue-t,#E9F1FF);color:var(--np-blue)}
.np-tbl-pill.p-manager{background:var(--npd-orange-t,#FFF0E2);color:var(--npd-orange-ink,#B9560B)}
.np-tbl-pill.p-serwis{background:var(--np-ink);color:var(--np-on-ink)}
.np-prog-info{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);text-wrap:pretty}
.np-prog-info .np-ico{flex:none;width:22px;height:22px;color:var(--np-blue)}
.np-prog-bar{flex:none;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(15.5px * var(--np-ts,1));font-weight:600}
.np-prog-bar .np-seg{width:220px}.np-prog-bar .np-seg button{height:38px}
.np-prog-bar small{margin-left:auto;font-size:calc(13.5px * var(--np-ts,1));font-weight:400;color:var(--np-ink-3)}
.np-prog-search{flex:none;display:flex;align-items:center;gap:10px}
.np-prog-search .np-seg{width:220px}
.np-prog-q{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(17px * var(--np-ts,1));text-align:left}
.np-prog-q .np-ico{width:20px;height:20px;color:var(--np-ink-3)}
.np-prog-q .ph{color:var(--np-ink-3)}
.np-prog-q.focus{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-caret{width:2px;height:24px;margin-left:-8px;background:var(--np-blue);animation:np-blink 1s steps(1) infinite}
@keyframes np-blink{50%{opacity:0}}
.np-prog-search .np-pill-btn{height:40px}
.np-prog-osk{flex:none;padding:8px;border-radius:var(--np-r-lg);background:var(--npd-osk,#E9EBEE)}
.np-prog-osk .np-osk{animation:none;padding:0;background:transparent}
.np-prog-osk.num{display:grid;grid-template-columns:360px 160px;justify-content:end;gap:12px;height:230px;padding:10px}
.np-prog-osk.num .np-numpad{gap:6px}
.np-prog-osk.num > .np-btn{height:auto}
/* Formularz */
.np-pf.narrow{width:min(620px,calc(100% - 24px));height:auto;max-height:min(740px,calc(100% - 24px))}
.np-pf .np-pe-body{flex:1;min-height:0}
.np-pf.narrow .np-pe-body{flex:0 1 auto}
.np-pe-card.one{grid-template-columns:minmax(0,1fr)}
.np-pf-ct{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;margin-bottom:-2px}
.np-pf-ct b{font-size:calc(13px * var(--np-ts,1));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-pf-ct small{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-pe-l em.req{color:var(--np-red);font-weight:700}
.np-pe-l em.cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.np-pf-hint{font-size:calc(13px * var(--np-ts,1));line-height:1.35;color:var(--np-ink-3);text-wrap:pretty}
.np-pe-in.mono{text-align:left;font-family:var(--np-mono);letter-spacing:.02em}
.np-pf-note{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;background:var(--np-surface-2);font-size:calc(14.5px * var(--np-ts,1));line-height:1.4;color:var(--np-ink-2);text-wrap:pretty}
.np-pf-note .np-ico{flex:none;width:20px;height:20px;margin-top:1px;color:var(--np-ink-3)}
.np-pf-note.warn{background:var(--npd-orange-t,#FFF3E6);color:var(--npd-orange-ink,#8A4208)}
.np-pf-note.warn .np-ico{color:var(--np-orange,#F07A1A)}
.np-pf-check{width:100%;display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:12px 14px;border-radius:12px;background:var(--np-surface-2);text-align:left}
.np-pf-check > i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--np-ink-3);color:transparent}
.np-pf-check > i .np-ico{width:17px;height:17px}.np-pf-check > i .np-ico svg{stroke-width:3}
.np-pf-check.on > i{background:var(--np-blue);box-shadow:none;color:#fff}
.np-pf-check b{display:block;font-size:calc(16.5px * var(--np-ts,1));font-weight:600;line-height:26px}
.np-pf-check small{display:block;margin-top:2px;font-size:calc(13.5px * var(--np-ts,1));line-height:1.35;color:var(--np-ink-3)}
.np-pf-btn{height:50px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:calc(16.5px * var(--np-ts,1))}
.np-pf-btn .np-ico{width:20px;height:20px}
.np-pf-scan{display:grid;place-items:center;background:var(--np-blue)}
.np-pf-scan .np-ico{width:22px;height:22px}
.np-pf-icons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.np-pf-icons button{height:54px;border-radius:12px;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink)}
.np-pf-icons button .np-ico{width:26px;height:26px}
.np-pf-icons button.on{background:var(--np-green);color:#fff}
/* Podgląd paragonu */
.np-rcpt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px 16px;border-radius:6px;background:#fff;color:#1a1a1a;font-family:var(--np-mono);font-size:calc(14px * var(--np-ts,1));text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 -6px 0 -4px #eee}
.np-rcpt b{font-size:calc(15.5px * var(--np-ts,1));font-weight:700}
.np-rcpt i{font-style:normal;color:#999;padding-bottom:6px;border-bottom:1px dashed #bbb;width:100%}
.np-rcpt .sum{width:100%;display:flex;justify-content:space-between;padding:6px 0 10px;font-weight:700}
.np-rcpt .bars{width:70%;height:42px;margin-top:10px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px)}
.np-rcpt .qrph{margin-top:10px;width:70px;height:70px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #111}
.np-rcpt .qrph .np-ico{width:44px;height:44px}
/* Kod QR */
.np-qr-vars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.np-qr-vars button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;background:var(--np-surface-2);text-align:left}
.np-qr-vars b{font-family:var(--np-mono);font-size:calc(14.5px * var(--np-ts,1));color:var(--np-blue)}
.np-qr-vars small{font-size:calc(12.5px * var(--np-ts,1));line-height:1.3;color:var(--np-ink-3)}
.np-qr-chars{display:flex;flex-wrap:wrap;gap:6px}
.np-qr-chars > span{min-width:36px;height:34px;padding:0 10px;border-radius:9px;display:grid;place-items:center;background:var(--np-surface-2);font-family:var(--np-mono);font-size:calc(14.5px * var(--np-ts,1))}
.np-qr-chars small{width:100%;margin-top:4px;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-qr-prev{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:6px;background:#fff;color:#1a1a1a}
.np-qr-prev.off{opacity:.45}
.np-qr-img svg{display:block;width:200px;height:200px}
.np-qr-empty{width:200px;height:200px;display:grid;place-items:center;color:#bbb;box-shadow:inset 0 0 0 2px #e3e3e3;border-radius:8px}
.np-qr-empty .np-ico{width:80px;height:80px}
.np-qr-prev code{max-width:100%;font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));word-break:break-all;text-align:center}
.np-qr-prev small{font-size:calc(13px * var(--np-ts,1));color:#777}
/* Profile uprawnień */
.np-perms{display:flex;flex-direction:column;gap:2px}
.np-perms-all{display:flex;align-items:center;gap:8px;padding-bottom:10px;font-size:calc(14.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-perms-all span{margin-right:6px}
.np-perms-all button{height:40px;padding:0 16px;border-radius:11px;background:var(--np-surface-2);font-size:calc(15px * var(--np-ts,1));font-weight:600}
.np-perm{display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:center;gap:14px;min-height:58px;padding:4px 2px;border-top:1px solid var(--np-hair)}
.np-perm > b{font-size:calc(16.5px * var(--np-ts,1));font-weight:600}
.np-perm .np-seg button{height:40px;font-size:calc(15px * var(--np-ts,1))}
.np-perm .np-seg button.on.pv-0{background:var(--np-green);color:#fff}
.np-perm .np-seg button.on.pv-1{background:var(--np-red);color:#fff}
.np-perm .np-seg button.on.pv-2{background:var(--np-orange,#F07A1A);color:#fff}
.np-perm-sum{display:flex !important;align-items:center;gap:6px;font-size:calc(14px * var(--np-ts,1))}
.np-perm-sum i{font-style:normal;min-width:28px;height:26px;padding:0 7px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.np-perm-sum i + i,.np-perm-sum i:not(:first-child){margin-left:6px}
.pv-0{--pv:var(--np-green)}.pv-1{--pv:var(--np-red)}.pv-2{--pv:var(--np-orange,#F07A1A)}
.np-perm-sum i{background:var(--pv)}
/* Karty rabatowe */
.np-disc{flex:none;padding:14px 16px 16px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2)}
.np-disc-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.np-disc-h > b{font-size:calc(18px * var(--np-ts,1));font-weight:650}
.np-disc-h > small{font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-3)}
.np-disc-def{margin-left:auto;display:flex;align-items:center;gap:12px}
.np-disc-def .np-set-val:disabled{opacity:.4}
.np-disc-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.np-disc-grid button{height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--np-surface-2)}
.np-disc-grid small{font-size:calc(12.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-3)}
.np-disc-grid b{font-size:calc(16px * var(--np-ts,1));font-weight:650;font-variant-numeric:tabular-nums}
.np-disc-grid button.def{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-cardfmt{display:flex;flex-direction:column;gap:10px}
.np-cardfmt-code{display:flex;flex-wrap:wrap;gap:3px;font-family:var(--np-mono);font-size:calc(24px * var(--np-ts,1));font-weight:600}
