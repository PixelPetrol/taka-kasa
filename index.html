<style>/* KASA NEXT PRO — 10,1″ 1280 × 800 (px = dp ekranu). Motyw jasny; kolory zależne od motywu: var(--npd-…, kolor jasny) — wartości ciemne w nextpro-dark.css */
:root{--np-gray:#6B6E74;--np-bg:#ECEEF1;--np-surface:#FFFFFF;--np-surface-2:#F4F5F7;--np-ink:#16171A;--np-ink-2:#5E6168;--np-ink-3:#9A9DA4;--np-hair:rgba(18,20,24,.08);--np-hair-2:rgba(18,20,24,.14);--np-red:#EF4219;--np-orange:#F07A1A;--np-green:#22BF6F;--np-green-700:#1ea35d;--np-blue:#0A7CFF;--np-teal:#2E6B72;--np-teal-900:#083D45;--np-graphite:#3A3B40;--np-pink:#EC5C9F;--np-lilac:#8E6CCF;--np-on-ink:#fff;--np-shadow-1:0 1px 2px rgba(16,18,22,.07),0 0 0 .5px rgba(16,18,22,.04);--np-shadow-2:0 6px 20px rgba(16,18,22,.05),0 1px 2px rgba(16,18,22,.05);--np-shadow-3:0 30px 80px rgba(16,18,22,.22),0 2px 8px rgba(16,18,22,.08);--np-r-xl:26px;--np-r-lg:20px;--np-r-md:16px;--np-r-sm:12px;--np-ease:cubic-bezier(.2,.8,.2,1);--np-font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;--np-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.np-lines-card{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow:hidden}

.np-empty{margin:auto;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--np-ink-3);font-size:calc(16px * var(--np-ts,1));line-height:1.45;text-wrap:pretty}

.np-line.dragging{transition:none}

.np-line-wrap.flash .np-line{animation:np-flash .8s ease-out}
@keyframes np-flash{0%{background:var(--npd-flash,#CFF1DE)}}
.np-line-r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.np-line-name{min-width:0;font-size:calc(18px * var(--np-ts,1));font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.np-line-total{flex:none;font-size:calc(19px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.np-line-r2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.np-line-calc{display:flex;align-items:center;gap:8px;min-width:0;font-size:calc(15.5px * var(--np-ts,1));color:var(--np-ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.np-adj,.np-ov{flex:none;font-style:normal;font-size:calc(12.5px * var(--np-ts,1));font-weight:650;padding:3px 7px;border-radius:6px}

.np-adj.up{background:var(--np-orange)}
.np-ov{background:var(--npd-orange-t,#FDEBDC);color:var(--npd-orange-i,#A54708)}
.np-stepper{flex:none;display:flex;align-items:center;height:38px;border-radius:999px;background:var(--np-surface);box-shadow:var(--np-shadow-1)}

.np-stepper button .np-ico{width:20px;height:20px}
.np-stepper button.del{color:var(--np-red)}
.np-stepper i{width:1px;height:18px;background:var(--np-hair-2)}
.np-line-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;animation:np-fadein .15s var(--np-ease)}
.np-line-actions button{height:42px;border-radius:11px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(15px * var(--np-ts,1));font-weight:550;display:flex;align-items:center;justify-content:center;gap:6px}

.np-line-actions button.danger{color:var(--np-red)}
.np-razem{flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-radius:var(--np-r-lg);background:var(--np-green);color:#fff;box-shadow:0 8px 22px rgba(34,191,111,.3);font-size:calc(22px * var(--np-ts,1));font-weight:600;transition:transform .12s var(--np-ease),background .15s}

.np-razem:disabled{background:var(--npd-off,#CDD1D6);box-shadow:none}
/* Panele kafelków */
.np-panels{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px}
.np-carousel{position:relative;flex:1;min-height:0;margin:-10px -6px;padding:10px 0;overflow:hidden;touch-action:pan-y}
.np-track{display:flex;height:100%;transition:transform .15s var(--np-ease);will-change:transform}

.np-page{flex:0 0 100%;height:100%;display:grid;gap:8px;padding:0 6px}

.np-tile{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 13px 12px 12px;border-radius:var(--np-r-md);overflow:hidden;color:#fff;text-align:right;box-shadow:var(--npd-tile-sh,0 1px 2px rgba(16,18,22,.14));transition:transform .14s var(--np-ease)}

.np-tile.c-white{background:var(--np-surface);color:var(--np-ink)}
.np-tile.c-gray{background:var(--np-gray)}.np-tile.c-red{background:var(--np-red)}.np-tile.c-orange{background:var(--np-orange)}.np-tile.c-green{background:var(--np-green)}.np-tile.c-blue{background:var(--np-blue)}.np-tile.c-teal{background:var(--np-teal)}.np-tile.c-graphite{background:var(--np-graphite)}.np-tile.c-pink{background:var(--np-pink)}.np-tile.c-lilac{background:var(--np-lilac)}

.np-tile.k-p{padding:11px}
.np-tile-count{min-width:28px;height:26px;padding:0 9px;border-radius:999px;background:#fff;color:#16171A;font-size:calc(14px * var(--np-ts,1));font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;animation:np-chipin .15s var(--np-ease)}

.np-tile-f{font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));font-weight:600;line-height:1;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.22)}
.np-tile-label{margin-top:auto;font-size:calc(18px * var(--np-ts,1));font-weight:500;line-height:1.14;letter-spacing:-.005em;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-tile.k-p .np-tile-label{font-size:calc(15.5px * var(--np-ts,1));white-space:normal;-webkit-line-clamp:3;hyphens:auto}
.np-tile.k-p.has-count .np-tile-label{-webkit-line-clamp:2}
.np-tile-price{margin-top:4px;font-size:calc(18px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

@container (max-height:104px){.np-tile{padding:10px 11px}.np-tile-ico{width:28px;height:28px}.np-tile-label{font-size:calc(16px * var(--np-ts,1))}.np-tile.k-p .np-tile-label{font-size:calc(15px * var(--np-ts,1));-webkit-line-clamp:2}.np-tile.k-p.has-count .np-tile-label{-webkit-line-clamp:1}.np-tile-price{font-size:calc(16px * var(--np-ts,1))}}
.np-tile.t-empty{background:transparent;box-shadow:none;border:1.5px dashed transparent;display:grid;place-items:center;color:transparent}

.np-panels.edit .np-tile.t-empty,.np-kbrow .np-tile.t-empty{border-color:rgba(var(--npd-tint,18,20,24),.16);color:var(--np-ink-3)}
.np-panels.edit .np-slot:not(.empty) .np-slot-in{animation:np-wiggle .3s ease-in-out infinite alternate}
.np-panels.edit .np-slot:nth-child(2n) .np-slot-in{animation-direction:alternate-reverse;animation-duration:.34s}
.np-panels.edit .np-slot:nth-child(3n) .np-slot-in{animation-duration:.27s}
@keyframes np-wiggle{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.np-panels.edit .np-tile{cursor:grab}
.np-slot.from .np-slot-in{opacity:.25}
.np-slot.over .np-tile{box-shadow:0 0 0 3px var(--np-blue)}
.np-slot.empty.over .np-tile{border-color:var(--np-blue);background:rgba(10,124,255,.07)}
.np-tile-rm{position:absolute;top:-7px;left:-7px;z-index:3;width:26px;height:26px;border-radius:50%;background:var(--npd-rm,#8A8D94);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.np-tile-rm .np-ico{width:16px;height:16px}
.np-tile-rm .np-ico svg{stroke-width:3}
.np-ghost{position:absolute;z-index:20;container-type:size;pointer-events:none;transform:scale(1.07) rotate(-1.5deg)}
.np-pagebar{flex:0 0 26px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 4px}
.np-pagebar-name{font-size:calc(15px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-dots{display:flex;align-items:center}
.np-dots button{padding:8px 4px}
.np-dots i{display:block;width:8px;height:8px;border-radius:999px;background:var(--npd-dot,#C3C6CC);transition:width .15s var(--np-ease),background .15s}

.np-pagebar-act{justify-self:end}
.np-pill-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;font-size:calc(14.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2);background:rgba(var(--npd-tint,18,20,24),.06)}

/* Klawiatura 1:1 */
.np-kbv{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.np-kbrow{flex:0 0 116px;display:grid;gap:8px}
.np-kbrow .np-slot{display:block;padding:0}
.np-kb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}
.np-key{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1),0 2px 0 var(--npd-key-sh,rgba(18, 20, 24, .06));font-size:40px;font-weight:400;font-variant-numeric:tabular-nums;transition:transform .08s}

.np-key.k-ok{background:var(--np-green);color:#fff}
.np-key.k-logo{background:var(--np-graphite);color:#fff}
.np-key .np-ico{width:28px;height:28px}
.np-key-cap{font-size:calc(14px * var(--np-ts,1));font-weight:700;letter-spacing:.06em}
.np-key-big{font-size:calc(34px * var(--np-ts,1));font-weight:600}

.np-key-hint{position:absolute;top:9px;right:11px;font-family:var(--np-mono);font-size:calc(12px * var(--np-ts,1));font-weight:600;letter-spacing:0;opacity:.5}
/* Wspólne: boczna lista */
.np-side{min-height:0;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow-y:auto;scrollbar-width:none}

.np-side-item{flex:none;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:13px;font-size:calc(16.5px * var(--np-ts,1));font-weight:550;text-align:left;color:var(--np-ink);transition:background .15s}
.np-side-item > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-side-item > .np-ico{width:21px;height:21px;color:var(--np-ink-2)}
.np-side-item small{margin-left:auto;font-size:calc(14px * var(--np-ts,1));font-weight:500;color:var(--np-ink-3);font-variant-numeric:tabular-nums}
.np-side-item:not(.on):active{background:var(--np-surface-2)}

/* Towary */
.np-goods{position:absolute;inset:0;display:grid;grid-template-columns:238px minmax(0,1fr);gap:12px}
.np-goods-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.np-search{flex:none;display:flex;align-items:center;gap:10px;height:54px;padding:0 10px 0 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-2);cursor:text;transition:none}

.np-search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:calc(19px * var(--np-ts,1));color:var(--np-ink)}

.np-search.focus,.np-search:focus-within{box-shadow:0 0 0 2.5px var(--np-blue),var(--np-shadow-2)}
.np-search.sm{height:46px;box-shadow:none;background:var(--np-surface);border:1px solid var(--np-hair)}

.np-search-x{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-search-x .np-ico{width:16px;height:16px}
.np-glist{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:0 6px 6px;scrollbar-width:thin}
.np-ghead,.np-grow{display:grid;grid-template-columns:44px minmax(0,1fr) 46px 88px 40px;align-items:center;gap:10px}
.np-ghead{position:sticky;top:0;z-index:1;padding:14px 12px 10px;background:var(--np-surface);font-size:calc(12.5px * var(--np-ts,1));font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--np-ink-3)}

.np-grow-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-grow-count{flex:none;font-style:normal;font-size:calc(12.5px * var(--np-ts,1));font-weight:700;padding:2px 8px;border-radius:999px;background:var(--np-ink);color:var(--np-on-ink)}
.np-grow-code{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}

.np-mi-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.np-mi-ico .np-ico{width:21px;height:21px}
.np-mi-badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--np-red);color:#fff;font-size:calc(12.5px * var(--np-ts,1));font-weight:700;display:grid;place-items:center}
.np-mi-label{font-size:calc(15.5px * var(--np-ts,1));font-weight:600;line-height:1.2;text-wrap:pretty}
/* Arkusze i dialogi */
.np-sheet-bg{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:var(--npd-scrim,rgba(18, 20, 24, .3));-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);animation:np-fade .15s ease-out}
@keyframes np-fade{from{opacity:0}}
.np-sheet{position:relative;max-width:calc(100% - 48px);max-height:calc(100% - 40px);display:flex;flex-direction:column;border-radius:28px;background:var(--npd-sheet,#F6F7F9);box-shadow:var(--np-shadow-3);animation:np-up .15s var(--np-ease)}
@keyframes np-up{from{opacity:0;transform:translateY(26px) scale(.98)}}
.np-dialog{width:540px;padding:30px 28px 24px;align-items:center;text-align:center}
.np-dlg-ico{width:68px;height:68px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:calc(36px * var(--np-ts,1));font-weight:700;line-height:1}
.np-dlg-ico .np-ico{width:34px;height:34px}
.np-dlg-ico .np-ico svg{stroke-width:2.6}
.np-dlg-ico.big{width:96px;height:96px}
.np-dlg-ico.big .np-ico{width:48px;height:48px}
.t-success{background:var(--np-green)}.t-warning{background:var(--np-orange)}.t-error{background:var(--np-red)}.t-question{background:var(--np-blue)}.t-info{background:var(--np-graphite)}.t-power{background:var(--np-graphite)}.t-progress{background:transparent}
.np-dlg-title{margin-top:16px;font-size:calc(25px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.np-dlg-desc{margin-top:8px;font-size:calc(17px * var(--np-ts,1));line-height:1.45;color:var(--np-ink-2);text-wrap:pretty}
.np-dlg-rows{width:100%;margin-top:18px;padding:2px 18px;border-radius:var(--np-r-md);background:var(--np-surface);text-align:left}
.np-dlg-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:calc(17px * var(--np-ts,1));font-variant-numeric:tabular-nums}
.np-dlg-row + .np-dlg-row{border-top:1px solid var(--np-hair)}
.np-dlg-row > span{color:var(--np-ink-2)}
.np-dlg-row > b{font-weight:600;text-align:right}
.np-dlg-actions{width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-top:22px}
.np-btn{height:58px;padding:0 16px;border-radius:var(--np-r-md);background:var(--npd-btn,#E4E6EA);font-size:calc(18px * var(--np-ts,1));font-weight:600;color:var(--np-ink);text-align:center;transition:transform .1s,opacity .15s}
.np-btn:not(:disabled):active{transform:scale(.98)}
.np-btn.green{background:var(--np-green);color:#fff}.np-btn.red{background:var(--np-red);color:#fff}.np-btn.blue{background:var(--np-blue);color:#fff}.np-btn.ink{background:var(--np-ink);color:var(--np-on-ink)}
.np-btn.wide{width:100%}
.np-btn:disabled{opacity:.4}
.np-spinner{width:58px;height:58px;flex:none;border-radius:50%;border:5px solid var(--npd-track,#DDE0E5);border-top-color:var(--np-blue);animation:np-spin .8s linear infinite}
.np-spinner.big{width:84px;height:84px;border-width:6px}
@keyframes np-spin{to{transform:rotate(360deg)}}
.np-progress{width:100%;height:6px;margin-top:24px;border-radius:3px;background:var(--npd-track,#E1E4E8);overflow:hidden}
.np-progress i{display:block;width:40%;height:100%;border-radius:3px;background:var(--np-blue);animation:np-prog 1.1s ease-in-out infinite}
@keyframes np-prog{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.np-sheet-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.np-seg{flex:none;display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(var(--npd-tint,18,20,24),.07)}
.np-seg button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-size:calc(16.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2);text-align:center;transition:background .15s,color .15s}
.np-seg button .np-ico{width:19px;height:19px}
.np-seg button.on{background:var(--npd-seg-on,var(--np-surface));color:var(--np-ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.np-seg button:disabled{opacity:.35}
.np-seg.full{margin-top:16px}
/* Kwota / numpad w arkuszu */
.np-amount{width:470px;padding:26px 24px 22px}
.np-amount-title{text-align:center;font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em}
.np-amount-desc{margin-top:6px;text-align:center;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-amount-field{margin-top:18px;height:84px;padding:0 22px;border-radius:var(--np-r-md);background:var(--np-surface);display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px var(--np-blue);overflow:hidden;white-space:nowrap}
.np-amount-field.err{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-amount-field small{font-size:calc(22px * var(--np-ts,1));font-weight:400;color:var(--np-ink-2)}
.np-amount-field .ph{color:var(--np-ink-3)}
.np-amount-err{height:24px;padding-top:6px;text-align:center;font-size:calc(14.5px * var(--np-ts,1));font-weight:500;color:var(--np-red)}
.np-amount .np-numpad{height:290px;margin-top:4px}
.np-presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.np-presets button{height:46px;border-radius:12px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(17px * var(--np-ts,1));font-weight:600;text-align:center}
.np-presets button.on{background:var(--np-ink);color:var(--np-on-ink)}
.np-rabat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.np-rabat-grid button{height:76px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(24px * var(--np-ts,1));font-weight:650;color:var(--np-red);text-align:center;font-variant-numeric:tabular-nums;transition:transform .1s}
.np-rabat-grid button:active{transform:scale(.96)}
/* Edytor kafelka */
.np-editor{width:1000px;height:680px;padding:0;overflow:hidden}
.np-ed-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px;padding:0 22px;border-bottom:1px solid var(--np-hair);background:var(--np-surface)}
.np-ed-title{text-align:center;font-size:calc(19px * var(--np-ts,1));font-weight:650;white-space:nowrap}
.np-ed-title > span{display:block;margin-top:2px;font-size:calc(13.5px * var(--np-ts,1));font-weight:400;color:var(--np-ink-2)}
.np-btn-text{justify-self:start;height:44px;padding:0 6px;font-size:calc(18px * var(--np-ts,1));font-weight:500;color:var(--np-blue)}
.np-btn-text.strong{justify-self:end;font-weight:650}
.np-ed-body{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr)}
.np-ed-side{display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-right:1px solid var(--np-hair)}
.np-ed-label{font-size:calc(12.5px * var(--np-ts,1));font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-ed-preview{position:relative;width:150px;height:140px;margin-bottom:8px}
.np-swatches{display:grid;grid-template-columns:repeat(5,44px);gap:8px;margin-bottom:8px}
.np-swatch{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:calc(15px * var(--np-ts,1));font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px var(--npd-swatch-ring,rgba(0,0,0,.08));transition:transform .12s}
.np-swatch.c-gray{background:var(--np-gray)}.np-swatch.c-white{background:var(--np-surface);color:var(--np-ink-2)}.np-swatch.c-red{background:var(--np-red)}.np-swatch.c-orange{background:var(--np-orange)}.np-swatch.c-green{background:var(--np-green)}.np-swatch.c-blue{background:var(--np-blue)}.np-swatch.c-teal{background:var(--np-teal)}.np-swatch.c-graphite{background:var(--np-graphite)}.np-swatch.c-pink{background:var(--np-pink)}.np-swatch.c-lilac{background:var(--np-lilac)}
.np-swatch.auto{background-image:linear-gradient(135deg,rgba(255,255,255,.35) 50%,transparent 50%)}
.np-swatch.on{box-shadow:0 0 0 3px var(--npd-sheet,#F6F7F9),0 0 0 5.5px var(--np-blue);transform:scale(.94)}
.np-ed-clear{margin-top:auto;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:var(--npd-red-t,#FFE9E3);color:var(--np-red);font-size:calc(16px * var(--np-ts,1));font-weight:600}
.np-ed-clear .np-ico{width:19px;height:19px}
.np-ed-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px 20px 0}
.np-chips{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.np-chips::-webkit-scrollbar{display:none}
.np-chips button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--np-surface);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(14.5px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);white-space:nowrap}
.np-chips button.on{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.np-ed-list{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.np-ed-row{flex:none;display:grid;grid-template-columns:42px minmax(0,1fr) auto 28px;align-items:center;gap:12px;min-height:58px;padding:6px 10px;border-radius:13px;text-align:left;transition:background .12s}
.np-ed-row:active{background:var(--npd-press,#E9EBEE)}
.np-ed-row.on{background:var(--npd-blue-t,#E6F0FF)}
.np-ed-row-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--np-surface);color:var(--np-ink-2);box-shadow:var(--np-shadow-1)}
.np-ed-row-ico[class*="bg-"]{color:#fff;box-shadow:none}
.np-ed-row-ico .np-ico{width:22px;height:22px}
.np-ed-row-main{min-width:0}
.np-ed-row-main b{display:block;font-size:calc(16.5px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ed-row-main small{display:block;margin-top:2px;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3);font-family:var(--np-mono)}
.np-ed-row-val{font-size:calc(16px * var(--np-ts,1));font-weight:650;font-variant-numeric:tabular-nums}
.np-ed-row-val.mono{font-family:var(--np-mono);color:var(--np-ink-2)}
.np-ed-check{color:var(--np-blue)}
.np-ed-check .np-ico{width:22px;height:22px}
.np-ed-check .np-ico svg{stroke-width:2.6}
.np-ed-empty{padding:40px;text-align:center;color:var(--np-ink-3)}
/* Płatność */
.np-pay{width:980px;height:660px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) auto;gap:18px 22px}
.np-pay-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.np-pay-title{font-size:calc(28px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-pay-title small{display:block;margin-top:2px;font-size:calc(15px * var(--np-ts,1));font-weight:400;letter-spacing:0;color:var(--np-ink-2)}
.np-pay-head .np-round-btn{background:var(--npd-btn,#E6E8EC)}
.np-pay-left{min-height:0;display:flex;flex-direction:column;gap:14px}
.np-pay-total{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 22px;border-radius:var(--np-r-lg);background:var(--npd-hero,var(--np-ink));color:#fff}
.np-pay-total > span{padding-bottom:6px;font-size:calc(17px * var(--np-ts,1));color:rgba(255,255,255,.7)}
.np-pay-total > b{font-size:58px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.np-pay-total > b small{margin-left:7px;font-size:calc(24px * var(--np-ts,1));font-weight:500;letter-spacing:0;color:rgba(255,255,255,.7)}
.np-methods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.np-method{height:90px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:calc(16px * var(--np-ts,1));font-weight:600;text-align:center;transition:background .15s,color .15s}
.np-method .np-ico{width:28px;height:28px}
.np-method.on{background:var(--np-green);color:#fff;box-shadow:none}
.np-tender{border-radius:var(--np-r-md);background:var(--np-surface);padding:0 22px}
.np-tender-row{display:flex;justify-content:space-between;align-items:center;height:66px;font-size:calc(18px * var(--np-ts,1));color:var(--np-ink-2)}
.np-tender-row + .np-tender-row{border-top:1px solid var(--np-hair)}
.np-tender-row > b{font-size:calc(32px * var(--np-ts,1));font-weight:600;color:var(--np-ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.np-tender-row > b.ph{color:var(--np-ink-3);font-weight:400}
.np-tender-row > b.change{color:var(--np-green-700)}
.np-tender-row > b.short{color:var(--np-red);font-size:calc(22px * var(--np-ts,1))}
.np-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.np-quick button{height:52px;border-radius:13px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(17px * var(--np-ts,1));font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.np-quick button.on{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.np-pay-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-radius:var(--np-r-lg);background:var(--np-surface);text-align:center}
.np-pay-info .np-ico{width:52px;height:52px;margin-bottom:6px;color:var(--np-green)}
.np-pay-info .np-ico svg{stroke-width:1.5}
.np-pay-info b{font-size:calc(22px * var(--np-ts,1));font-weight:650}
.np-pay-info > span{font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pay-right{min-height:0;display:flex}
.np-pay-right .np-numpad{flex:1}
.np-pay-right.off{opacity:.3;pointer-events:none}
.np-pay-foot{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.np-pay-foot .np-btn{height:64px;font-size:calc(20px * var(--np-ts,1))}
.np-pay-status{width:620px;height:auto;padding:44px 40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.np-pay-status-title{margin-top:24px;font-size:calc(28px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-pay-status-desc{margin-top:8px;font-size:calc(17px * var(--np-ts,1));color:var(--np-ink-2)}
.np-change{width:100%;margin-top:24px;padding:18px 24px;border-radius:var(--np-r-lg);background:var(--np-surface);display:flex;justify-content:space-between;align-items:flex-end}
.np-change > span{padding-bottom:8px;font-size:calc(19px * var(--np-ts,1));color:var(--np-ink-2)}
.np-change > b{font-size:60px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--np-green-700);font-variant-numeric:tabular-nums}
.np-change > b small{margin-left:6px;font-size:calc(26px * var(--np-ts,1));font-weight:500;color:var(--np-ink-2)}
.np-pay-status .np-btn.wide{margin-top:24px;height:62px;font-size:calc(20px * var(--np-ts,1))}
/* Komunikaty */
.np-toast{position:absolute;top:50px;left:50%;z-index:80;display:flex;align-items:center;gap:10px;max-width:760px;padding:12px 20px 12px 16px;border-radius:999px;background:var(--npd-toast,rgba(22,23,26,.92));color:#fff;font-size:calc(17px * var(--np-ts,1));font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transform:translateX(-50%);animation:np-toastin .15s var(--np-ease);white-space:nowrap}
.np-toast > span{overflow:hidden;text-overflow:ellipsis}
@keyframes np-toastin{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
.np-toast .np-ico{width:20px;height:20px}
.np-toast.t-ok .np-ico{color:#5BE39C}
.np-toast.t-err{background:rgba(239,66,25,.96)}

/* Narzędzia kolorów tła — na końcu, żeby wygrywały z tłami komponentów */
.bg-gray{background:var(--np-gray)}.bg-red{background:var(--np-red)}.bg-orange{background:var(--np-orange)}.bg-green{background:var(--np-green)}.bg-blue{background:var(--np-blue)}.bg-teal{background:var(--np-teal)}.bg-graphite{background:var(--np-graphite)}.bg-pink{background:var(--np-pink)}.bg-lilac{background:var(--np-lilac)}.bg-white{background:var(--np-surface-2)}
/* Paragon z lewej → listy grup (Towary, Menu) przy prawej krawędzi ekranu */
.np-sale.rl .np-goods{grid-template-columns:minmax(0,1fr) 238px}.np-sale.rl .np-menu{grid-template-columns:minmax(0,1fr) 232px}.np-sale.rl .np-goods > .np-side,.np-sale.rl .np-menu > .np-side{order:2}
/* Bez ramki (APK / ?ramka=0): tło jak aplikacja; ekran ładowania przed startem Reacta */
body.np-bare{background:var(--np-bg)}
.np-preload{position:fixed;inset:0;display:grid;place-items:center;background:#050506;color:#fff}
.np-preload .np-logo.big{animation:np-fade 1.2s ease-in-out infinite alternate}
/* Klawisz F — 3 × 3 programowalnych pól nad strefą roboczą */
.np-fsheet-bg{position:absolute;inset:-6px;z-index:30;display:flex;border-radius:var(--np-r-xl);background:var(--npd-frost-bg,rgba(236,238,241,.55));-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);animation:np-fade .15s ease-out}
.np-fsheet{flex:1;display:flex;flex-direction:column;gap:12px;margin:6px;padding:16px;border-radius:var(--np-r-xl);background:var(--npd-frost,rgba(255,255,255,.78));box-shadow:var(--np-shadow-3);animation:np-up .15s var(--np-ease)}
.np-fsheet-head{flex:none;display:flex;align-items:center;gap:10px}
.np-fsheet-title{flex:1;min-width:0;font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-fsheet-title small{display:block;margin-top:2px;font-size:calc(14.5px * var(--np-ts,1));font-weight:400;letter-spacing:0;color:var(--np-ink-2)}
.np-fsheet-head .np-pill-btn{height:40px;padding:0 16px;font-size:calc(15.5px * var(--np-ts,1))}
.np-fgrid3{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.np-fgrid3 .np-slot{display:block;padding:0}
.np-fgrid3 .np-tile{padding:16px}
.np-fgrid3 .np-tile-ico{width:46px;height:46px}
.np-fgrid3 .np-tile-label{font-size:calc(22px * var(--np-ts,1))}
.np-fgrid3 .np-tile.k-p .np-tile-label{font-size:calc(19px * var(--np-ts,1))}
.np-fgrid3 .np-tile-price{font-size:calc(21px * var(--np-ts,1))}
.np-fgrid3 .np-tile.t-empty{border-color:rgba(var(--npd-tint,18,20,24),.16);color:var(--np-ink-3)}
.np-fgrid3:not(.edit) .np-slot:not(.empty):active .np-tile{transform:scale(.97)}
.np-fgrid3.edit .np-slot:not(.empty) .np-slot-in{animation:np-wiggle .3s ease-in-out infinite alternate}
.np-fgrid3.edit .np-slot:nth-child(2n) .np-slot-in{animation-direction:alternate-reverse;animation-duration:.34s}
/* Logowanie: przełącznik PIN/hasło ↔ karta, pole hasła, czytnik kart */
.np-login-seg{margin-top:18px}
.np-pass-field{flex:none;margin-top:14px;height:64px;display:flex;align-items:center;gap:8px;padding:0 8px 0 20px;border-radius:var(--np-r-md);background:var(--np-surface-2);box-shadow:inset 0 0 0 2px var(--np-blue);font-size:calc(28px * var(--np-ts,1));font-weight:500;letter-spacing:.12em;font-variant-numeric:tabular-nums;transition:none}
.np-pass-field .v{flex:1;min-width:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.np-pass-field .ph{font-size:calc(18px * var(--np-ts,1));font-weight:400;letter-spacing:0;color:var(--np-ink-3)}
.np-pass-field .np-caret{height:30px}
.np-pass-field.err{box-shadow:inset 0 0 0 2px var(--np-red);animation:np-shake .45s}
.np-pass-field.ok{box-shadow:inset 0 0 0 2px var(--np-green)}
.np-pass-eye{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--np-ink-2)}
.np-pass-eye .np-ico{width:22px;height:22px}
.np-pin .np-pin-msg{margin-top:8px}
.np-pin .np-osk{margin-top:auto}
.np-card-read{flex:none;margin-top:14px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--np-r-md);background:var(--npd-blue-t,#E9F1FF);text-align:left}
.np-card-read > .np-ico{width:36px;height:36px;color:var(--np-blue)}
.np-card-read b{display:block;font-size:calc(17px * var(--np-ts,1));font-weight:600}
.np-card-read > span > span{display:block;margin-top:2px;font-size:calc(14px * var(--np-ts,1));color:var(--np-ink-2)}
.np-card-read.reading > .np-ico{animation:np-fade .5s ease-in-out infinite alternate}
.np-osk-k.enter{background:var(--np-green);color:#fff;font-size:calc(16px * var(--np-ts,1));font-weight:600;box-shadow:none}
.np-osk-k.enter:active{background:var(--np-green-700)}
.np-nk.ok{background:var(--np-green);color:#fff;font-size:calc(22px * var(--np-ts,1));font-weight:650}
.np-nk.ok:active{background:var(--np-green-700)}
.np-tab.dis{opacity:.38}
/* Kafelek z piktogramem / powiększony */
.np-tile.k-p.has-ico .np-tile-label{-webkit-line-clamp:2}
.np-tile.big .np-tile-ico{width:52px;height:52px}
.np-tile.big .np-tile-label{font-size:calc(24px * var(--np-ts,1));font-weight:600}
.np-tile.big.k-p .np-tile-label{font-size:calc(21px * var(--np-ts,1));-webkit-line-clamp:3}
.np-tile.big .np-tile-price{font-size:calc(26px * var(--np-ts,1))}
/* Edytor: podgląd w skali rozmiaru, rozmiar, piktogram */
.np-ed-side{overflow-y:auto;scrollbar-width:none}
.np-ed-preview{flex:none;position:relative;width:116px;height:118px;margin-bottom:6px;container-type:size;transition:width .15s var(--np-ease),height .15s var(--np-ease)}
.np-ed-preview.w2{width:240px}.np-ed-preview.h2{height:244px}
.np-sizes{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:4px}
.np-sizes button{height:58px;border-radius:12px;background:var(--np-surface);box-shadow:inset 0 0 0 1px var(--np-hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:calc(13px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-sizes button.on{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.np-sizes button:disabled{opacity:.3}
.np-size-ico{display:grid;gap:2px}
.np-size-ico i{display:block;border-radius:2px;background:currentColor;opacity:.75}
.np-ed-icon{flex:none;display:grid;grid-template-columns:42px minmax(0,1fr) 20px;align-items:center;gap:10px;min-height:56px;padding:6px 10px 6px 6px;border-radius:13px;background:var(--np-surface);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(15.5px * var(--np-ts,1));font-weight:550;text-align:left;margin-bottom:6px}
.np-ed-icon > span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ed-icon > .np-ico{width:18px;height:18px;color:var(--np-ink-3)}
.np-ed-icon.on{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-ed-pickhead{flex:none;display:flex;align-items:center;gap:10px}
.np-ed-pickhead b{flex:1;font-size:calc(19px * var(--np-ts,1));font-weight:650}
.np-ed-pickhead .np-pill-btn{height:36px}
.np-pict-grid{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:2px 8px 16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:88px;gap:6px;align-content:start}
.np-pict{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;border-radius:13px;background:var(--np-surface);box-shadow:var(--np-shadow-1);color:var(--np-ink);min-width:0}
.np-pict > span{width:32px;height:32px;display:block}
.np-pict > span svg{width:100%;height:100%;stroke-width:1.6}
.np-pict small{max-width:100%;font-size:calc(11.5px * var(--np-ts,1));color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-pict.on{background:var(--np-ink);color:var(--np-on-ink)}.np-pict.on small{color:var(--npd-on-ink-2,rgba(255,255,255,.75))}
.np-pict:active{transform:scale(.95)}
/* Pasek płatności pod paragonem: 3 szybkie płatności + Razem (po prawej) */
.np-paybar{flex:0 0 72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.np-paybar .np-razem{flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:0 18px;font-size:calc(15px * var(--np-ts,1));font-weight:600}
.np-paybar .np-razem > span{opacity:.85}
.np-paybar .np-razem > b{font-size:calc(25px * var(--np-ts,1));white-space:nowrap}
html.np-big .np-paybar .np-razem{gap:3px;font-size:21px;font-weight:650;line-height:1}
html.np-big .np-paybar .np-razem > span{opacity:1}
html.np-big .np-paybar .np-razem > b{font-size:32px;line-height:1}
.np-qpay{display:grid;gap:6px;min-width:0}
.np-qpay .np-slot{display:block;padding:0;min-height:0}
.np-qpay .np-tile{padding:7px 6px;align-items:center;justify-content:center;text-align:center;gap:3px;border-radius:14px}
.np-qpay .np-tile-top{justify-content:center;min-height:0}
.np-qpay .np-tile-top > span:empty{display:none}
.np-qpay .np-tile-ico{width:24px;height:24px}
.np-qpay .np-tile-label{margin-top:0;font-size:calc(12.5px * var(--np-ts,1));font-weight:600;line-height:1.12;-webkit-line-clamp:2}
.np-qpay .np-tile-price,.np-qpay .np-tile-count{display:none}
.np-qpay .np-tile.t-empty{border-color:rgba(var(--npd-tint,18,20,24),.16);color:var(--np-ink-3)}
.np-qpay .np-slot:not(.empty):active .np-tile{transform:scale(.95)}
/* Płatność dzielona */
.np-pay-total > span{display:flex;flex-direction:column;gap:3px}
.np-pay-total em{font-style:normal;font-size:calc(14px * var(--np-ts,1));color:rgba(255,255,255,.55)}
.np-pays{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.np-pay-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 12px;border-radius:999px;background:var(--npd-green-t,#DFF5E9);color:var(--npd-green-i,#0E7440);font-size:calc(15px * var(--np-ts,1));font-weight:600;font-variant-numeric:tabular-nums}
.np-pay-chip .np-ico{width:17px;height:17px}
.np-pay-chip button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--npd-green-t2,rgba(14,116,64,.12))}
.np-pay-chip button .np-ico{width:14px;height:14px}
.np-pay-chip:not(:has(button)){padding-right:12px}
.np-method{height:76px}
.np-tender-row{height:58px}
.np-tender-row > b{font-size:calc(28px * var(--np-ts,1))}
.np-tender-row > b.rest{color:var(--np-ink-2)}
.np-pay-hint{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:13px;background:rgba(var(--npd-tint,18,20,24),.04);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pay-hint .np-ico{width:20px;height:20px}
.np-pay-status .np-dlg-rows{margin-top:20px}
/* Poprawki układu płatności dzielonej */
.np-pay-left{gap:10px}
.np-pay-total{padding:14px 20px;align-items:center;gap:16px}
.np-pay-total > span{flex:1;min-width:0;padding-bottom:0}
.np-pay-total em{white-space:nowrap}
.np-pay-total > b{flex:none;font-size:52px}
.np-pays{margin-top:0}
.np-method{height:62px;flex-direction:row;gap:8px}
.np-method .np-ico{width:24px;height:24px}
.np-tender-row{height:54px}
.np-quick button,.np-pay-hint{height:48px}
/* Menu — siatka dynamiczna, NoviCloud, Ustawienia, listy */
.np-menu-grid{grid-auto-rows:minmax(0,1fr)}
.np-menu-grid.dim{opacity:.4}
.np-mi-label{hyphens:auto}
.np-cloud{flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-cloud-head{display:flex;align-items:center;gap:10px;font-size:calc(18px * var(--np-ts,1))}
.np-cloud-head b{font-weight:650}
.np-cloud-dot{width:10px;height:10px;border-radius:50%;background:var(--np-ink-3)}
.np-cloud-dot.on{background:var(--np-green);box-shadow:0 0 0 4px rgba(34,191,111,.18)}
.np-cloud-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.np-cloud-rows > div{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:11px;background:var(--np-surface-2)}
.np-cloud-rows > div > span{font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-2)}
.np-cloud-rows > div > b{font-size:calc(17px * var(--np-ts,1));font-weight:600}
.np-cloud-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.np-check{display:flex;align-items:center;gap:10px;font-size:calc(15.5px * var(--np-ts,1));font-weight:500}
.np-check > i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--np-ink-3);color:transparent}
.np-check > i .np-ico{width:16px;height:16px}
.np-check > i .np-ico svg{stroke-width:3}
.np-check.on > i{background:var(--np-blue);box-shadow:none;color:#fff}
.np-cloud.off{gap:14px}
.np-side-back{color:var(--np-blue);font-weight:600}
.np-side-back > .np-ico{color:var(--np-blue)}
.np-set-list{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:0 16px;scrollbar-width:thin}
.np-set-row{display:flex;align-items:center;gap:16px;padding:14px 0}
.np-set-row + .np-set-row{border-top:1px solid var(--np-hair)}
.np-set-txt{flex:1;min-width:0}
.np-set-txt > b{display:flex;align-items:center;gap:8px;font-size:calc(17px * var(--np-ts,1));font-weight:600}
.np-set-txt > b > i{font-style:normal;font-size:calc(11.5px * var(--np-ts,1));font-weight:600;padding:2px 7px;border-radius:6px;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-set-txt > span{display:block;margin-top:4px;font-size:calc(14px * var(--np-ts,1));line-height:1.4;color:var(--np-ink-2);text-wrap:pretty}
.np-switch{flex:none;position:relative;width:58px;height:34px;border-radius:999px;background:var(--npd-switch,#D9DCE0);transition:background .15s}
.np-switch > i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .15s var(--np-ease)}
.np-switch.on{background:var(--np-green)}
.np-switch.on > i{transform:translateX(24px)}
.np-set-val{flex:none;display:flex;align-items:center;gap:4px;height:40px;padding:0 8px 0 14px;border-radius:11px;background:var(--np-surface-2);font-size:calc(15.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink);white-space:nowrap}
.np-set-val .np-ico{width:16px;height:16px;color:var(--np-ink-3)}
.np-set-info{flex:none;font-size:calc(15.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-choose{width:480px}
.np-choices{width:100%;margin-top:18px;display:flex;flex-direction:column;border-radius:var(--np-r-md);background:var(--np-surface);overflow:hidden}
.np-choices > button{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;font-size:calc(17px * var(--np-ts,1));font-weight:500;text-align:left}
.np-choices > button + button{border-top:1px solid var(--np-hair)}
.np-choices > button.on{color:var(--np-blue);font-weight:600}
.np-choices > button .np-ico{width:20px;height:20px}
.np-choices > button:active{background:var(--np-surface-2)}
.np-sub{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px}
.np-subhead{flex:0 0 44px;display:flex;align-items:center;gap:12px}
.np-subhead .np-pill-btn{height:40px;padding:0 14px 0 10px;font-size:calc(15.5px * var(--np-ts,1))}
.np-subhead-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.np-subhead-t > b{font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.np-subhead-t > small{font-size:calc(14.5px * var(--np-ts,1));color:var(--np-ink-3)}
.np-list-card{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:4px 8px}
.np-list-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;gap:14px;min-height:62px;padding:8px 10px;border-radius:12px;text-align:left}
.np-list-row + .np-list-row{box-shadow:0 -1px 0 var(--np-hair)}
.np-list-row:active{background:var(--np-surface-2)}
.np-list-main > b{display:block;font-size:calc(17px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-list-main > small{display:block;margin-top:2px;font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-3)}
.np-list-val{font-size:calc(15.5px * var(--np-ts,1));color:var(--np-ink-2);white-space:nowrap}
.np-list-row > .np-ico{width:18px;height:18px;color:var(--np-ink-3)}
/* Menu: kafelki nie rozpychają wierszy */
.np-menu-grid{overflow:hidden}
.np-mi{min-height:0;min-width:0;overflow:hidden;padding:10px 11px}
.np-mi-ico{width:34px;height:34px;flex:none}
.np-mi-ico .np-ico{width:19px;height:19px}
.np-mi-label{font-size:calc(14.5px * var(--np-ts,1));line-height:1.16;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.np-menu-grid.dense{gap:6px}
.np-menu-grid.dense .np-mi{padding:8px 9px}
.np-menu-grid.dense .np-mi-ico{width:30px;height:30px;border-radius:9px}
.np-menu-grid.dense .np-mi-ico .np-ico{width:17px;height:17px}
.np-menu-grid.dense .np-mi-label{font-size:calc(13px * var(--np-ts,1))}
.np-cloud{padding:12px 14px;gap:8px}
.np-cloud-rows > div{padding:6px 12px}
.np-mi-label{overflow-wrap:normal;word-break:normal}
.np-menu-grid.dense .np-mi{padding:8px 7px}
.np-menu-grid.dense .np-mi-label{font-size:calc(12.5px * var(--np-ts,1));letter-spacing:-.01em}
/* Menu: kwadratowe, pełne czerwone kafelki w układzie 4 kolumn jak w kasie NEXT (ta sama kolejność) */
.np-menu-grid.sq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:auto;align-content:start;gap:8px;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px 4px;scrollbar-width:none}
.np-menu-grid.sq::-webkit-scrollbar{display:none}
.np-menu-grid.sq .np-mi{aspect-ratio:1/1;height:auto;min-height:0;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--np-red);color:#fff;box-shadow:0 1px 2px rgba(16,18,22,.16);border-radius:var(--np-r-md)}
.np-menu-grid.sq .np-mi:active{transform:scale(.96)}
.np-menu-grid.sq .np-mi-ico{width:46px;height:46px;border-radius:0;background:none;display:grid;place-items:center;color:#fff}
.np-menu-grid.sq .np-mi-ico .np-ico{width:42px;height:42px}
.np-menu-grid.sq .np-mi-ico .np-ico svg{stroke-width:1.5}
.np-menu-grid.sq .np-mi-label{font-size:calc(14px * var(--np-ts,1));font-weight:550;line-height:1.15;color:#fff;-webkit-line-clamp:3}
.np-menu-grid.sq .np-mi-badge{background:#fff;color:var(--np-red)}
.np-menu-main{min-height:0}
.np-menu-grid.sq{flex:1;min-height:0;grid-auto-rows:min-content}
.np-menu-grid.sq .np-mi{min-height:auto;overflow:hidden;padding:8px 7px;gap:6px}
.np-menu-grid.sq .np-mi-ico{width:38px;height:38px;flex:none}
.np-menu-grid.sq .np-mi-ico .np-ico{width:34px;height:34px}
.np-menu-grid.sq .np-mi-label{flex:none;font-size:calc(13px * var(--np-ts,1));line-height:1.15;max-height:calc(3 * 1.15em)}
.np-menu-grid.sq .np-mi.c-blue{background:var(--np-blue)}
.np-menu-grid.sq .np-mi.c-blue .np-mi-badge{color:var(--np-blue)}
/* Logowanie: przycisk Menu (hamburger) */
.np-login-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.np-menu-btn{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 12px;border-radius:999px;background:var(--np-surface-2);font-size:calc(16px * var(--np-ts,1));font-weight:600;color:var(--np-ink)}
.np-menu-btn .np-ico{width:22px;height:22px}
.np-menu-btn:active{background:var(--npd-press,#E3E5E9)}
/* Menu bez logowania (z ekranu logowania) */
.np-menuinfo-head{display:flex;align-items:center;gap:14px}
.np-menuinfo-head b{display:block;font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-menuinfo-head small{display:block;margin-top:2px;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}
.np-menuinfo-ico{width:52px;height:52px;flex:none;border-radius:15px;background:var(--np-ink);color:var(--np-on-ink);display:grid;place-items:center}
.np-menuinfo-ico .np-ico{width:26px;height:26px}
.np-menuinfo{padding:6px 20px;overflow-y:auto}
.np-menuinfo-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;font-size:calc(16px * var(--np-ts,1))}
.np-menuinfo-row + .np-menuinfo-row{border-top:1px solid var(--np-hair)}
.np-menuinfo-row > span{color:var(--np-ink-2)}
.np-menuinfo-row > b{font-weight:600;text-align:right}
.np-razem.np-exit{justify-content:center;gap:12px;font-size:calc(24px * var(--np-ts,1))}
.np-razem.np-exit .np-ico{width:26px;height:26px}
/* Wielkość interfejsu i tekstu (Parametry ogólne) */
.np-screen-wrap{position:relative;width:1280px;height:800px;overflow:hidden;border-radius:12px;background:var(--np-bg)}
.np-device.bare .np-screen-wrap{border-radius:0}
.np-screen{transform-origin:0 0;border-radius:0}
.np-sale{grid-template-columns:minmax(0,1fr) clamp(400px,39.8%,560px)}
.np-sale.rl{grid-template-columns:clamp(400px,39.8%,560px) minmax(0,1fr)}
.np-login{grid-template-columns:minmax(0,1fr) clamp(440px,40%,520px)}
.np-pay{width:min(980px,calc(100% - 24px));height:min(660px,calc(100% - 24px))}
.np-editor{width:min(1000px,calc(100% - 24px));height:min(680px,calc(100% - 24px))}
.np-dialog{max-height:calc(100% - 24px);overflow-y:auto}
.np-amount{max-height:calc(100% - 24px);overflow-y:auto}
.np-tile-label,.np-mi-label,.np-line-name,.np-grow-t,.np-list-main > b,.np-set-txt > b{overflow-wrap:normal}
.np-tab > span,.np-side-item > span,.np-pill-btn,.np-btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Mniejszy ekran logiczny (większy interfejs / tekst): listy boczne i kolumny dopasowują się */
.np-goods{grid-template-columns:clamp(176px,32%,238px) minmax(0,1fr)}
.np-sale.rl .np-goods{grid-template-columns:minmax(0,1fr) clamp(176px,32%,238px)}
.np-menu{grid-template-columns:clamp(180px,32%,232px) minmax(0,1fr)}
.np-sale.rl .np-menu{grid-template-columns:minmax(0,1fr) clamp(180px,32%,232px)}
.np-goods-main{container-type:inline-size}
@container (max-width:470px){
  .np-ghead,.np-grow{grid-template-columns:minmax(0,1fr) auto 36px}
  .np-grow-ico,.np-grow-vat,.np-ghead > span:nth-child(2){display:none}
  .np-ghead-title{grid-column:1/2}
}
.np-tabs{container-type:inline-size}
@container (max-width:680px){.np-tab .np-ico{display:none}}
.np-side{container-type:inline-size}
@container (max-width:200px){.np-side-chip{width:28px;height:28px}.np-side-item{gap:9px;padding:0 9px}}
/* Napisy na kafelkach: rosną z tekstem, ale nie bardziej niż pozwala szerokość kafelka (cqi) */
.np-tile-label{font-size:min(calc(18px * var(--np-ts,1)), 17cqi);hyphens:auto}
.np-tile.k-p .np-tile-label{font-size:min(calc(15.5px * var(--np-ts,1)), 15cqi)}
.np-tile-price{font-size:min(calc(18px * var(--np-ts,1)), 18cqi)}
.np-tile.big .np-tile-label{font-size:min(calc(24px * var(--np-ts,1)), 10.5cqi)}
.np-tile.big.k-p .np-tile-label{font-size:min(calc(21px * var(--np-ts,1)), 9.5cqi)}
.np-tile.big .np-tile-price{font-size:min(calc(26px * var(--np-ts,1)), 12cqi)}
.np-qpay .np-tile-label{font-size:min(calc(12.5px * var(--np-ts,1)), 15cqi)}
.np-fgrid3 .np-tile-label{font-size:min(calc(22px * var(--np-ts,1)), 11cqi)}
.np-menu-grid.sq .np-mi{container-type:inline-size}
.np-menu-grid.sq .np-mi-label{font-size:min(calc(13px * var(--np-ts,1)), 12.5cqi);hyphens:auto}
.np-tile.tall:not(.big) .np-tile-label{-webkit-line-clamp:5}
.np-tile.tall:not(.big) .np-tile-ico{width:40px;height:40px}
.np-qpay .np-tile-label{font-size:min(calc(12.5px * var(--np-ts,1)), 17cqi)}
/* Wskaźnik przewijania (ScrollArea) */
.np-sa{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.np-sa > .np-sa-in{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.np-sa > .np-sa-in::-webkit-scrollbar{display:none}
.np-sa.fade-b > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent)}
.np-sa.fade-t > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px);mask-image:linear-gradient(to bottom,transparent,#000 28px)}
.np-sa.fade-t.fade-b > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 44px),transparent)}
.np-sa-bar{position:absolute;top:8px;bottom:8px;right:4px;width:5px;border-radius:3px;background:rgba(var(--npd-tint,18,20,24),.06);opacity:0;transition:opacity .15s,width .15s;z-index:2;pointer-events:none}
.np-sa.can .np-sa-bar{opacity:1}
.np-sa-bar > i{position:absolute;top:0;left:0;right:0;border-radius:3px;background:rgba(var(--npd-tint,18,20,24),.3);transition:background .15s;pointer-events:auto;cursor:grab;touch-action:none}
.np-sa-bar > i:before{content:"";position:absolute;inset:-6px -12px}
.np-sa.active .np-sa-bar{width:7px}
.np-sa.active .np-sa-bar > i{background:rgba(var(--npd-tint,18,20,24),.55)}
.np-sa.v-out .np-sa-bar{right:-9px}
.np-sa-more{position:absolute;left:50%;bottom:10px;z-index:3;display:flex;align-items:center;gap:4px;height:32px;padding:0 14px 0 10px;border-radius:999px;background:var(--npd-toast,rgba(22,23,26,.9));color:#fff;font-size:calc(13.5px * var(--np-ts,1));font-weight:600;transform:translateX(-50%);box-shadow:0 6px 16px rgba(0,0,0,.18);animation:np-fade .15s}
.np-sa-more .np-ico{width:18px;height:18px}
.np-sa-more:active{transform:translateX(-50%) scale(.95)}
.np-sa > .np-set-list,.np-sa > .np-list-card,.np-sa > .np-glist{scrollbar-width:none}
.np-tile-price{flex:none}
.np-tile-top{flex:none}
@container (max-height:72px){.np-tile{padding:7px 9px}.np-tile.k-f .np-tile-ico{width:22px;height:22px}.np-tile-top{min-height:0}.np-tile.k-p .np-tile-top{display:none}.np-tile-price{margin-top:2px}.np-tile-price small{display:none}}
/* Wydajność (słabe urządzenie): naciśnięcie = transform + przyciemnienie nakładką (opacity), bez filter/box-shadow */
.np-ghost .np-tile{box-shadow:0 18px 30px rgba(0,0,0,.25)}
.np-btn{position:relative}
.np-tile::after,.np-key::after,.np-mi::after,.np-btn::after,.np-nk::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
.np-nk{position:relative}
.np-panels:not(.edit) .np-slot:not(.empty):active .np-tile::after,.np-kbrow .np-slot:not(.empty):active .np-tile::after,.np-qpay .np-slot:not(.empty):active .np-tile::after,.np-fgrid3:not(.edit) .np-slot:not(.empty):active .np-tile::after,.np-key:active::after,.np-key.press::after,.np-menu-grid.sq .np-mi:active::after,.np-btn:not(:disabled):active::after,.np-nk:active::after{opacity:.1}
.np-tile-count{display:none}
/* ═══ Pozycja paragonu: duże − / + po bokach (mniej pomyłek) ═══ */
.np-line.qb{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:stretch;padding:0;min-height:68px}
.np-line-body{min-width:0;padding:10px 12px 9px;display:flex;flex-direction:column;justify-content:center}
.np-line.qb .np-line-r2{margin-top:5px}
.np-line.qb .np-line-total{font-size:calc(19px * var(--np-ts,1))}
.np-qb{display:grid;place-items:center;background:rgba(var(--npd-tint,18,20,24),.055);color:var(--np-ink);transition:background .1s,transform .1s}
.np-qb:first-child{border-radius:var(--np-r-md) 0 0 var(--np-r-md);box-shadow:inset -1px 0 0 var(--np-hair)}
.np-qb:last-child{border-radius:0 var(--np-r-md) var(--np-r-md) 0;box-shadow:inset 1px 0 0 var(--np-hair)}
.np-qb .np-ico{width:26px;height:26px}
.np-qb .np-ico svg{stroke-width:2.2}
.np-qb:active{background:rgba(var(--npd-tint,18,20,24),.14)}
.np-qb.del{color:var(--np-red)}
.np-line.sel .np-qb{background:rgba(10,124,255,.1)}
/* ═══ Towary: pasek akcji, aktywne filtry, edycja ═══ */
.np-gbar{flex:none;display:flex;align-items:center;gap:6px;min-width:0}
.np-gbar-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding-left:4px}
.np-gbar-title b{font-size:calc(19px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gbar-title small{font-size:calc(14px * var(--np-ts,1));color:var(--np-ink-3)}
.np-gbar .np-pill-btn{flex:none;height:38px;padding:0 12px;font-size:calc(14.5px * var(--np-ts,1));background:var(--np-surface);box-shadow:var(--np-shadow-1);color:var(--np-ink)}
.np-gbar .np-pill-btn.ink{background:var(--np-ink);color:var(--np-on-ink)}
.np-gbar .np-pill-btn.green{background:var(--np-green);color:#fff;box-shadow:none}
.np-gbar .np-pill-btn .np-ico{width:17px;height:17px}
.np-gbar-n{font-style:normal;min-width:20px;height:20px;padding:0 6px;margin-left:2px;border-radius:999px;background:#fff;color:#16171A;font-size:calc(12px * var(--np-ts,1));font-weight:700;display:grid;place-items:center}
.np-gactive{flex:none;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 12px;border-radius:12px;background:var(--npd-blue-t,#E6F0FF);color:var(--npd-blue-i,#0A56BD);font-size:calc(14px * var(--np-ts,1));font-weight:550}
.np-gactive > .np-ico{width:16px;height:16px}
.np-gactive > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gactive > button{height:28px;padding:0 10px;border-radius:999px;background:var(--npd-blue-t2,rgba(10,86,189,.12));font-size:calc(13px * var(--np-ts,1));font-weight:600}
.np-ghead,.np-grow{grid-template-columns:minmax(0,1fr) 86px 40px 40px}
.np-grow-ico,.np-ghead > span:first-child:empty{display:none}
.np-grow.manage{grid-template-columns:44px minmax(0,1fr) 46px 86px 40px}
.np-grow.off{opacity:.55}
.np-grow.off .np-grow-name{text-decoration:line-through}
.np-gedit{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--np-ink-3)}
.np-gedit .np-ico{width:20px;height:20px}
.np-gedit:active{background:var(--np-surface-2)}
@container (max-width:470px){.np-ghead,.np-grow{grid-template-columns:minmax(0,1fr) auto 36px 36px}.np-grow.manage{grid-template-columns:minmax(0,1fr) auto 36px}}
.np-sub-body{position:relative;flex:1;min-height:0}
.np-pill-btn.danger{color:var(--np-red)}
/* ═══ Filtry towarów ═══ */
.np-gfilter{width:min(560px,calc(100% - 24px));padding:22px 22px 18px;gap:16px}
.np-gf-head{display:flex;align-items:center;justify-content:space-between}
.np-gf-head b{font-size:calc(22px * var(--np-ts,1));font-weight:650}
.np-gf-sec{display:flex;flex-direction:column;gap:8px}
.np-gf-sec > span{display:flex;align-items:center;justify-content:space-between;font-size:calc(12.5px * var(--np-ts,1));font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-gf-chips{display:flex;flex-wrap:wrap;gap:8px}
.np-fchip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 10px;border-radius:12px;background:var(--np-surface);box-shadow:inset 0 0 0 1.5px var(--np-hair-2);font-size:calc(15.5px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2)}
.np-fchip > i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--np-ink-3);color:transparent}
.np-fchip > i .np-ico{width:15px;height:15px}
.np-fchip > i .np-ico svg{stroke-width:3}
.np-fchip.on{background:var(--npd-blue-t,#E9F1FF);box-shadow:inset 0 0 0 1.5px var(--np-blue);color:var(--np-ink)}
.np-fchip.on > i{background:var(--np-blue);box-shadow:none;color:#fff}
.np-btn-text.sm{height:auto;padding:0;font-size:calc(13px * var(--np-ts,1));text-transform:none;letter-spacing:0}
/* ═══ Karta towaru ═══ */
.np-pe{width:min(1120px,calc(100% - 24px));height:min(740px,calc(100% - 24px));padding:0;overflow:hidden}
.np-pe-head{flex:none;display:flex;align-items:center;gap:12px;height:66px;padding:0 20px 0 24px;border-bottom:1px solid var(--np-hair);background:var(--np-surface)}
.np-pe-title{flex:1;min-width:0}
.np-pe-title b{display:block;font-size:calc(22px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em}
.np-pe-title small{display:block;font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pe-head .np-pill-btn{height:40px}
.np-pe-body{padding:14px 16px 18px}
.np-pe-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.np-pe-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.np-pe-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;padding:14px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-pe-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.np-pe-f.span{grid-column:1/-1}
.np-pe-l{display:flex;align-items:baseline;gap:6px;font-size:calc(12.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-pe-l em{font-style:normal;color:var(--np-ink-3);font-weight:500}
.np-pe-row{display:flex;gap:6px;min-width:0}
.np-pe-in{flex:1;min-width:0;height:46px;padding:0 12px;border:0;outline:0;border-radius:11px;background:var(--np-surface-2);font:inherit;font-size:calc(16.5px * var(--np-ts,1));color:var(--np-ink);box-shadow:inset 0 0 0 1px var(--np-hair);caret-color:var(--np-blue)}
.np-pe-in::placeholder{color:var(--np-ink-3)}
.np-pe-in.num{text-align:right;font-variant-numeric:tabular-nums}
.np-pe-in.big{height:54px;font-size:calc(24px * var(--np-ts,1));font-weight:650}
.np-pe-in.ro{color:var(--np-ink-2);background:transparent}
.np-pe-in.focus{background:var(--npd-focus,#fff);box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-pe-in.err{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-pe-in.area{height:auto;min-height:84px;padding:10px 12px;resize:none;line-height:1.35}
.np-pe-err{font-size:calc(13px * var(--np-ts,1));font-weight:550;color:var(--np-red)}
.np-pe-gen{flex:none;width:52px;border-radius:11px;background:var(--np-green);color:#fff;font-size:calc(20px * var(--np-ts,1));font-weight:700;letter-spacing:.05em}
.np-pe-gen:active{background:var(--np-green-700)}
.np-pe-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;padding:0 10px 0 12px;border-radius:11px;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(16px * var(--np-ts,1));font-weight:550;text-align:left;min-width:0}
.np-pe-sel > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-pe-sel .np-ico{width:18px;height:18px;color:var(--np-ink-3);flex:none}
.np-pe-sel.on{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-pe-step{display:flex;align-items:center;gap:0;height:46px;border-radius:11px;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair);align-self:flex-start}
.np-pe-step button{width:56px;height:46px;display:grid;place-items:center}
.np-pe-step button .np-ico{width:20px;height:20px}
.np-pe-step b{min-width:44px;text-align:center;font-size:calc(18px * var(--np-ts,1));font-variant-numeric:tabular-nums}
.np-pe-tot{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 12px;border-radius:11px;background:transparent;box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);font-variant-numeric:tabular-nums}
.np-pe-tot b{color:var(--np-ink)}
.np-pe-descs{display:flex;flex-direction:column;gap:6px}
.np-pe-descs .np-pe-in{height:40px;font-size:calc(15px * var(--np-ts,1))}
.np-pe-osk{flex:none;padding:8px;border-top:1px solid var(--np-hair);background:var(--npd-osk,#E9EBEE)}
.np-pe-osk .np-osk{animation:none;padding:0;background:transparent}
.np-pe-foot{flex:none;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px;border-top:1px solid var(--np-hair);background:var(--np-surface)}
.np-pe-foot .np-btn{height:58px}
.np-pe-pick{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:var(--npd-scrim,rgba(18, 20, 24, .28));border-radius:inherit}
.np-pe-pickbox{width:min(460px,calc(100% - 40px));max-height:calc(100% - 60px);display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:var(--npd-sheet,#F6F7F9);box-shadow:var(--np-shadow-3)}
.np-pe-pickhead{display:flex;align-items:center;justify-content:space-between}
.np-pe-pickhead b{font-size:calc(19px * var(--np-ts,1));font-weight:650}
.np-pe-pickbox .np-sa{max-height:520px}
.np-pe-pickbox .np-choices{margin-top:0}
.np-pe-gen{display:flex;align-items:center;justify-content:center;gap:4px}
.np-pe-gen > i{width:5px;height:5px;border-radius:50%;background:#fff}
.np-pe-osk.num{display:grid;grid-template-columns:minmax(0,1fr) 360px 160px;gap:12px;align-items:stretch;height:250px;padding:10px 16px}
.np-pe-osk.num .np-numpad{gap:6px}
.np-pe-osk.num .np-nk{font-size:calc(26px * var(--np-ts,1))}
.np-pe-osk.num > .np-btn{height:auto}
.np-pe-numl{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding-left:8px}
.np-pe-numl b{font-size:calc(14px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-pe-numl span{font-size:calc(34px * var(--np-ts,1));font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* − / + : „pigułka w pigułce” — strefa dotyku nadal cała kolumna, wizualnie kapsuła wewnątrz zaokrąglonej pozycji */
.np-qb-in{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit}
.qs-pill .np-line.qb{grid-template-columns:58px minmax(0,1fr) 58px;padding:6px;border-radius:22px;min-height:72px}
.qs-pill .np-line-wrap{border-radius:22px}
.qs-pill .np-qb{background:none;box-shadow:none!important;border-radius:0;padding:0;color:var(--np-ink)}
.qs-pill .np-qb-in{border-radius:999px;background:var(--np-surface);box-shadow:var(--npd-qb-sh,0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06));transition:transform .1s,background .1s}
.qs-pill .np-qb .np-ico{width:24px;height:24px}
.qs-pill .np-qb .np-ico svg{stroke-width:2.4}
.qs-pill .np-qb:active .np-qb-in{transform:scale(.92);background:var(--npd-press,#E6E8EC)}
.qs-pill .np-qb.plus .np-qb-in{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.qs-pill .np-qb.plus:active .np-qb-in{background:#33353A}
.qs-pill .np-qb.del .np-qb-in{background:var(--npd-red-t,#FFE9E3);color:var(--np-red);box-shadow:none}
.qs-pill .np-line-body{padding:4px 10px}
.qs-pill .np-line.sel .np-qb{background:none}
.qs-pill .np-line.sel .np-qb-in{box-shadow:0 0 0 1.5px rgba(10,124,255,.35)}
.qs-pill .np-line.sel .np-qb.plus .np-qb-in{box-shadow:none}
/* dopracowanie: pionowe kapsuły, spokojniejszy kolor (bez ciemnych kół i czerwonych koszy w każdym wierszu) */
.qs-pill .np-qb{display:flex;align-items:stretch;justify-content:center}
.qs-pill .np-qb-in{width:46px;height:auto;min-height:48px}
.qs-pill .np-qb.plus .np-qb-in{background:var(--np-surface);color:var(--np-ink);box-shadow:var(--npd-qb-sh,0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06))}
.qs-pill .np-qb.plus .np-ico svg{stroke-width:2.6}
.qs-pill .np-qb.plus:active .np-qb-in{background:var(--npd-green-t,#DFF5E9);color:var(--npd-green-i,#0E7440)}
.qs-pill .np-qb.del .np-qb-in{background:var(--np-surface);color:var(--np-ink-3);box-shadow:var(--npd-qb-sh,0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06))}
.qs-pill .np-qb.del:active .np-qb-in{background:var(--npd-red-t,#FFE9E3);color:var(--np-red)}
.qs-pill .np-qb:not(.plus):not(.del) .np-ico{color:var(--np-ink-2)}
.qs-pill .np-qb.del .np-qb-in{background:var(--npd-red-t,#FFE9E3);color:var(--np-red);box-shadow:none}

.np-total-label{align-items:flex-start}

.np-docadj-r{display:flex;flex-direction:column;min-width:0}
.np-docadj-r .np-amount-field{margin-top:0}
.np-docadj-r .np-numpad{height:280px}
/* Piktogramy: wybór (arkusz), pole w karcie towaru, asortymenty */
.np-pictsheet{width:min(900px,calc(100% - 24px));height:min(660px,calc(100% - 24px));padding:18px 20px 0;gap:12px}

.np-pe-pict-ico{width:52px;height:52px;border-radius:12px;background:var(--np-surface);display:grid;place-items:center;color:var(--np-ink-3);box-shadow:var(--np-shadow-1)}

.np-pe-pict-t{min-width:0}
.np-pe-pict-t b{display:block;font-size:calc(16px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-pe-pict-t small{display:block;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-pe-pict-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--np-surface);color:var(--np-ink-2)}
.np-pe-pict-x .np-ico{width:16px;height:16px}
.np-grow-ico.own{background:var(--np-gray);color:#fff}
.np-list-row.grp{grid-template-columns:48px minmax(0,1fr) auto 18px}
.np-grp-ico{width:48px;height:48px;border-radius:13px;background:var(--np-surface-2);display:grid;place-items:center;color:var(--np-ink)}

.np-list-row.grp .np-list-val{color:var(--np-blue);font-weight:600}
.np-docadj-pre button{text-align:center}
/* Arkusze: jawne ścieżki siatki — duża zawartość (np. 251 piktogramów) nie rozpycha tła */
.np-sheet-bg{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);justify-items:center;align-items:center}
.np-sheet{min-height:0;min-width:0}
.np-pictsheet .np-sa{min-height:0}
/* ═══ Zwarty pasek sumy ═══ */

.np-sum-who{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--np-mono);font-size:calc(12.5px * var(--np-ts,1));color:var(--np-ink-3)}
.np-sum-who > i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-family:var(--np-font);font-size:calc(10.5px * var(--np-ts,1));font-weight:700}
.np-sumcard.cmp .np-buffer{flex:1;height:40px;margin-top:0;padding-right:4px}
.np-sumcard.cmp .np-entry{flex:none;padding-right:2px;letter-spacing:0;font-size:calc(36px * var(--np-ts,1))}
.np-entry-more{font-style:normal;color:var(--np-ink-3);margin-right:-2px}
.np-sumcard.cmp .np-caret{height:32px}
.np-sumcard.cmp .np-chip{height:32px;font-size:calc(16px * var(--np-ts,1));padding:0 10px}
.np-sumcard.cmp .np-event{font-size:calc(15px * var(--np-ts,1))}
.np-sumcard.cmp .np-event code{font-size:calc(14px * var(--np-ts,1));padding:4px 7px}
.np-sumcard.cmp .np-buffer-ph{font-size:calc(15px * var(--np-ts,1))}
.np-sumcard.cmp .np-total-row{margin-top:2px;align-items:center}

.np-flag{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-flag .np-ico{width:18px;height:18px}
.np-flag.f-nip{background:var(--npd-blue-t,#E6F0FF);color:var(--npd-blue-i,#0A56BD)}
.np-flag.f-fv{background:var(--np-ink);color:var(--np-on-ink)}
.np-flag.f-adj{box-shadow:inset 0 0 0 1px var(--np-hair)}
.np-flag.f-adj.on{background:var(--npd-red-t,#FFE9E3);color:var(--np-red);box-shadow:none}
.np-flag.f-adj.up{background:var(--npd-orange-t,#FDEBDC);color:var(--npd-orange-i,#A54708);box-shadow:none}

.np-sum-sub{min-width:0;margin-left:2px;font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.np-sum-sub em.up{color:var(--npd-orange-i,#A54708)}
.np-sum-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.np-sum-adj{max-width:100%;padding-left:2px;font-size:calc(15px * var(--np-ts,1));font-weight:650;color:var(--np-red);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* paragon: mniejsze odstępy między kartami prawej kolumny */
.np-right{gap:8px}
.np-lines{padding:6px;gap:5px}
/* pasek sumy: wiersz kasjera + większa suma */
.np-sumcard.cmp{padding:8px 14px 10px}
.np-sum-head{display:flex;align-items:center;justify-content:space-between;gap:10px;height:26px;min-width:0}
.np-sumcard.tap{cursor:pointer;transition:transform .12s var(--np-ease),filter .12s}
.np-sumcard.tap:active{transform:scale(.99);filter:brightness(.97)}
.np-dopt{width:min(1060px,calc(100% - 24px));height:min(680px,calc(100% - 24px));padding:22px;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:16px 22px}
.np-dopt-l{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.np-dopt-l .np-amount-title{text-align:left;margin-bottom:4px}
.np-dopt-l .np-docadj-sum{margin-top:auto}
.np-dopt-f{position:relative;flex:none;display:flex;align-items:stretch;border-radius:14px;background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-dopt-f.on{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-dopt-f.err.on{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-dopt-fb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 12px;text-align:left}
.np-dopt-ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-dopt-ic .np-ico{width:20px;height:20px}
.np-dopt-f.has .np-dopt-ic{background:var(--npd-blue-t,#E6F0FF);color:var(--npd-blue-i,#0A56BD)}
.np-dopt-t small{display:block;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-dopt-fb b{display:flex;align-items:center;min-width:0;font-size:calc(19px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.np-dopt-fb b .ph{font-weight:400;color:var(--np-ink-3)}
.np-dopt-fb em{display:block;font-style:normal;font-size:calc(13px * var(--np-ts,1));color:var(--np-red)}
.np-dopt-t{display:block;min-width:0;flex:1}
.np-dopt-x{flex:none;width:52px;display:grid;place-items:center;color:var(--np-ink-3)}
.np-dopt-x .np-ico{width:18px;height:18px}
.np-dopt-r{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.np-dopt-r .np-seg.full{margin-top:0}
.np-dopt-pad{flex:1;min-height:0}
.np-dopt-hint{padding:4px 2px;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}

.np-dopt-osk .np-osk{animation:none;padding:0;background:transparent}
.np-dopt-act{grid-column:1 / -1;margin-top:0}
.np-docadj-pre button:disabled{opacity:.4}
.np-dopt-kind button{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.np-dopt-kind .np-ico{width:18px;height:18px}
.np-dopt-kind button.on.up{color:var(--npd-orange-i,#A54708)}
.np-docadj-sum .pos b{color:var(--npd-orange-i,#A54708)}
.np-sum-adj.up{color:var(--npd-orange-i,#A54708)}
.np-sum-no{display:inline-flex;align-items:center;gap:3px}
.np-sum-no .np-ico{width:15px;height:15px;opacity:.7}
.np-sum-hint{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:5px;max-width:68%;font-size:calc(13.5px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.np-sum-hint b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:650;color:var(--np-green)}
.np-sum-hint .np-ico{flex:none;width:15px;height:15px;color:var(--np-green)}
.np-sum-hint.none{color:var(--np-red)}
.np-sum-hint i{flex:none;font-style:normal;color:var(--np-ink-3)}
.np-sum-hint.exact i::after{content:'·';margin-left:5px}
.np-flag.f-note{background:var(--npd-orange-t,#FDEBDC);color:var(--npd-orange-i,#A54708)}
.np-lmenu-it:disabled{opacity:.4}
.np-rnote-fld{display:flex;gap:10px;align-items:stretch}
.np-rnote-fld .np-gdesc-fld{flex:1;min-width:0}
.np-rnote-save{flex:none;display:inline-flex;align-items:center;gap:7px;padding:0 16px}
.np-rnote-save .np-ico{width:18px;height:18px}
.np-rnote-save:disabled{opacity:.45}
.np-rnote-list{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;max-height:100px;overflow:auto}
.np-rnote-empty{align-self:center;font-size:calc(14px * var(--np-ts,1));color:var(--np-ink-3)}
.np-rnote-chip{display:inline-flex;align-items:center;height:44px;border-radius:12px;background:var(--np-surface);box-shadow:var(--np-shadow-1);overflow:hidden}
.np-rnote-chip > button{height:100%;padding:0 4px 0 14px;font-size:calc(15px * var(--np-ts,1));font-weight:550;color:var(--np-ink)}

.np-rnote-chip > button.x .np-ico{width:16px;height:16px}
.np-rnote-chip.on{background:var(--np-ink)}
.np-rnote-chip.on > button{color:var(--np-on-ink)}
.np-sum-head .np-sum-who{min-width:0;font-family:var(--np-font);font-size:calc(14.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-sum-head .np-sum-who > b{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sum-no{flex:none;font-family:var(--np-mono);font-size:calc(12.5px * var(--np-ts,1));color:var(--np-ink-3)}
.np-sumcard.cmp .np-sum-top{height:42px;margin-top:2px}
.np-sumcard.cmp .np-total-row{margin-top:4px}
/* ═══ Podsumowanie po zakończeniu paragonu ═══ */
.np-done{width:min(640px,calc(100% - 24px));height:auto;padding:0;display:flex;flex-direction:column;overflow:hidden}
.np-done-head{display:flex;align-items:center;gap:16px;padding:22px 24px 18px;background:var(--np-green);color:#fff}
.np-done-ok{width:56px;height:56px;flex:none;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;animation:np-pop .15s var(--np-ease)}
.np-done-ok .np-ico{width:32px;height:32px}
.np-done-ok .np-ico svg{stroke-width:3}
.np-done-t{min-width:0}
.np-done-t b{display:block;font-size:calc(23px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em}
.np-done-t small{display:block;margin-top:3px;font-size:calc(14.5px * var(--np-ts,1));color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-done-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:16px 20px 0}
.np-done-sum{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:14px 18px;border-radius:var(--np-r-md);background:var(--np-surface)}
.np-done-sum > span{font-size:calc(14px * var(--np-ts,1));color:var(--np-ink-2)}
.np-done-sum > b{font-size:calc(40px * var(--np-ts,1));font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.np-done-sum > b small{margin-left:5px;font-size:.45em;font-weight:500;color:var(--np-ink-2)}
.np-done-sum > em{font-style:normal;font-size:calc(13px * var(--np-ts,1));color:var(--np-red)}
.np-done-sum > em.up{color:var(--npd-orange-i,#A54708)}
.np-done-pays{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border-radius:var(--np-r-md);background:var(--np-surface)}

.np-done-pay > span:nth-child(2){color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-done-pay > b{font-weight:650;font-variant-numeric:tabular-nums}
.np-done-pay-ico{width:34px;height:34px;border-radius:10px;background:var(--npd-green-t,#DFF5E9);color:var(--npd-green-i,#0E7440);display:grid;place-items:center}
.np-done-pay-ico .np-ico{width:18px;height:18px}
.np-done-change{display:flex;align-items:center;justify-content:space-between;margin:12px 20px 0;padding:14px 20px;border-radius:var(--np-r-md);background:var(--npd-amber-t,#FFF4E5);box-shadow:inset 0 0 0 2px var(--npd-amber-b,#F7C27A)}
.np-done-change > span{font-size:calc(18px * var(--np-ts,1));font-weight:600;color:var(--npd-amber-i,#8A4B00)}
.np-done-change > b{font-size:calc(48px * var(--np-ts,1));font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--npd-amber-i,#8A4B00);font-variant-numeric:tabular-nums}
.np-done-change > b small{margin-left:6px;font-size:.45em;font-weight:500}
.np-done-foot{position:relative;padding:16px 20px 20px}
.np-done-foot .np-btn{height:62px;font-size:calc(20px * var(--np-ts,1))}
.np-done-auto{position:absolute;left:20px;right:20px;top:8px;height:3px;border-radius:2px;background:var(--np-hair);overflow:hidden}
.np-done-auto i{display:block;height:100%;background:var(--np-green);transform-origin:left;animation:np-autobar 2.6s linear forwards}
@keyframes np-autobar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ═══ Kafelki: większa, czytelna nazwa; cena tylko po włączeniu w ustawieniach ═══ */
.np-tile-price{display:none}
.np-show-prices .np-tile-price{display:block}
