<style>/* TAKA KASA — 10,1″ 1280 × 800 (px = dp ekranu). Tylko tryb jasny. */
:root{--np-gray:#6B6E74;--np-bg:#ECEEF1;--np-surface:#FFFFFF;--np-surface-2:#F4F5F7;--np-ink:#16171A;--np-ink-2:#5E6168;--np-ink-3:#9A9DA4;--np-hair:rgba(18,20,24,.08);--np-hair-2:rgba(18,20,24,.14);--np-red:#EF4219;--np-orange:#F07A1A;--np-green:#22BF6F;--np-green-700:#1ea35d;--np-blue:#0A7CFF;--np-teal:#2E6B72;--np-teal-900:#083D45;--np-graphite:#3A3B40;--np-shadow-1:0 1px 2px rgba(16,18,22,.07),0 0 0 .5px rgba(16,18,22,.04);--np-shadow-2:0 6px 20px rgba(16,18,22,.05),0 1px 2px rgba(16,18,22,.05);--np-shadow-3:0 30px 80px rgba(16,18,22,.22),0 2px 8px rgba(16,18,22,.08);--np-r-xl:26px;--np-r-lg:20px;--np-r-md:16px;--np-r-sm:12px;--np-ease:cubic-bezier(.2,.8,.2,1);--np-font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;--np-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#D6D9DE}
body{font-family:var(--np-font);color:var(--np-ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--np-blue);text-decoration:none}a:hover{color:var(--np-teal)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
input{font:inherit}
mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}
#root{position:fixed;inset:0}
.np-stage{position:absolute;inset:0}
/* Urządzenie */
.np-device{position:absolute;left:50%;top:50%;width:1336px;height:892px;padding:28px 28px 64px;background:#131417;border-radius:50px;box-shadow:inset 0 0 0 1.5px #2a2c31,inset 0 2px 0 #3b3d43,0 40px 90px rgba(10,12,16,.32),0 8px 24px rgba(10,12,16,.22)}
.np-device:before{content:"";position:absolute;top:11px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#24262b;box-shadow:inset 0 0 0 1.5px #1a1b1f}
.np-device-label{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:calc(17px * var(--np-ts,1));font-weight:700;letter-spacing:.34em;color:#595c63}
.np-device-label b{font-weight:300}
.np-device.bare{width:1280px;height:800px;padding:0;background:none;border-radius:0;box-shadow:none}
.np-device.bare:before{display:none}
.np-screen{position:relative;width:1280px;height:800px;overflow:hidden;border-radius:12px;background:var(--np-bg);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;isolation:isolate}
.np-device.bare .np-screen{border-radius:0}
.np-scr{flex:1;min-height:0;display:flex;flex-direction:column;animation:np-enter .15s var(--np-ease)}
@keyframes np-enter{from{opacity:0;transform:scale(1.012)}}
.np-ico{display:inline-flex;flex:none;width:24px;height:24px}
.np-ico svg{width:100%;height:100%;stroke-width:1.8}
/* Pasek statusu */
.np-status{position:relative;z-index:2;flex:0 0 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;font-size:calc(15px * var(--np-ts,1))}
.np-logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:calc(16px * var(--np-ts,1));letter-spacing:.18em}
.np-logo b{font-weight:600;font-size:calc(10.5px * var(--np-ts,1));letter-spacing:.14em;padding:3px 6px 2px;border-radius:5px;background:var(--np-ink);color:#fff}
.np-status-date{display:flex;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.np-status-date > span{font-weight:400;color:var(--np-ink-2)}
.np-status-icons{justify-self:end;display:flex;align-items:center;gap:14px}
.np-status-icons .np-ico{width:18px;height:18px}
.np-batt{position:relative;width:27px;height:13px;border:1.5px solid var(--np-ink);border-radius:4px;padding:1.5px;margin-right:3px}
.np-batt i{display:block;width:78%;height:100%;border-radius:1.5px;background:var(--np-ink)}
.np-batt:after{content:"";position:absolute;right:-4.5px;top:3px;width:2.5px;height:4px;border-radius:0 1px 1px 0;background:var(--np-ink)}
/* Logowanie */
.np-login{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:24px;padding:8px 24px 24px}
.np-login-left{display:flex;flex-direction:column;justify-content:space-between;padding:44px 20px 10px 36px;min-width:0}
.np-login-time{font-size:180px;font-weight:200;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.np-login-date{margin-top:22px;font-size:calc(30px * var(--np-ts,1));color:var(--np-ink-2)}
.np-login-shop{display:flex;flex-direction:column;gap:4px;font-size:calc(17px * var(--np-ts,1));color:var(--np-ink-2)}
.np-login-shop b{font-size:calc(22px * var(--np-ts,1));font-weight:600;color:var(--np-ink);margin-bottom:2px}
.np-login-status{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.np-pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(15px * var(--np-ts,1));font-weight:500;color:var(--np-ink)}
.np-pill i{width:8px;height:8px;border-radius:50%;background:var(--np-green)}
.np-login-card{min-height:0;background:var(--np-surface);border-radius:var(--np-r-xl);box-shadow:var(--np-shadow-2);padding:28px;display:flex;flex-direction:column;overflow:hidden}
.np-login-list{display:flex;flex-direction:column;animation:np-fadein .15s var(--np-ease)}
.np-login-title{font-size:calc(30px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-login-sub{margin-top:6px;font-size:calc(17px * var(--np-ts,1));color:var(--np-ink-2)}
.np-cashiers{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.np-cashier{min-height:92px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:12px 14px 12px 12px;border-radius:var(--np-r-lg);background:var(--np-surface-2);text-align:left;transition:background .15s,transform .12s var(--np-ease)}
.np-cashier:active{transform:scale(.985);background:#E8EAED}
.np-cashier-name{display:block;font-size:calc(21px * var(--np-ts,1));font-weight:600}
.np-cashier-role{display:block;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);margin-top:3px}
.np-cashier-num{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:calc(15px * var(--np-ts,1));font-weight:600;font-family:var(--np-mono);color:var(--np-ink-2);background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-cashier .np-ico{width:22px;height:22px;color:var(--np-ink-3)}
.np-avatar{display:grid;place-items:center;flex:none;border-radius:50%;color:#fff;font-weight:600;letter-spacing:.02em}
.np-pin{flex:1;min-height:0;display:flex;flex-direction:column;animation:np-push .15s var(--np-ease)}
@keyframes np-push{from{transform:translateX(36px);opacity:0}}
.np-pin-head{display:flex;align-items:center;gap:14px}
.np-round-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--np-surface-2);transition:background .15s}
.np-round-btn:active{background:#E3E5E9}
.np-round-btn .np-ico{width:22px;height:22px}
.np-pin-who > b{display:block;font-size:calc(22px * var(--np-ts,1));font-weight:600}
.np-pin-who > span{display:block;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);margin-top:2px}
.np-pin-label{margin-top:26px;text-align:center;font-size:calc(18px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pin-dots{display:flex;justify-content:center;gap:24px;margin:18px 0 10px}
.np-pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--np-ink-3);transition:background .12s,border-color .12s,transform .12s}
.np-pin-dots i.on{background:var(--np-ink);border-color:var(--np-ink);transform:scale(1.05)}
.np-pin-dots.ok i{background:var(--np-green);border-color:var(--np-green)}
.np-pin-dots.err{animation:np-shake .45s}
.np-pin-dots.err i{background:var(--np-red);border-color:var(--np-red)}
@keyframes np-shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.np-pin-msg{height:22px;text-align:center;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-3)}
.np-pin-msg.err{color:var(--np-red);font-weight:500}
.np-pin .np-numpad{flex:1;min-height:0;margin-top:12px}
/* Numpad */
.np-numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px}
.np-nk{border-radius:var(--np-r-md);background:var(--np-surface-2);font-size:calc(32px * var(--np-ts,1));font-weight:450;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:transform .08s,background .12s}
.np-nk:active{transform:scale(.96);background:#E3E5E9}
.np-nk.muted{background:transparent;font-size:calc(18px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-nk.blank{visibility:hidden}
.np-nk .np-ico{width:30px;height:30px}
.np-numpad.on-gray .np-nk{background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-numpad.on-gray .np-nk.muted{background:#E9EBEE;box-shadow:none}
.np-numpad.on-gray .np-nk:active{background:#E3E5E9}
/* Wyłączona / start */
.np-off{position:absolute;inset:0;z-index:90;background:#050506;display:grid;place-items:center;cursor:pointer}
.np-off > span{display:flex;align-items:center;gap:12px;color:#55575d;font-size:calc(18px * var(--np-ts,1))}
.np-off .np-ico{width:22px;height:22px}
.np-boot{position:absolute;inset:0;z-index:90;background:#050506;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;animation:np-fade .15s}
.np-logo.big{font-size:44px;gap:14px;letter-spacing:.2em}
.np-logo.big b{font-size:calc(24px * var(--np-ts,1));padding:6px 12px 5px;border-radius:9px;background:#fff;color:#050506}
.np-boot-bar{width:180px;height:4px;border-radius:2px;background:#25272c;overflow:hidden}
.np-boot-bar i{display:block;height:100%;border-radius:2px;background:#fff;animation:np-bootbar 1.6s var(--np-ease) forwards}
@keyframes np-bootbar{from{width:0}to{width:100%}}
/* Sprzedaż — układ */
.np-sale{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:12px;padding:0 12px 12px}
.np-sale.rl{grid-template-columns:500px minmax(0,1fr)}.np-sale.rl .np-right{order:-1}
.np-left{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.np-work{position:relative;flex:1;min-height:0}
.np-work > *{animation:np-fadein .15s var(--np-ease)}
@keyframes np-fadein{from{opacity:0;transform:translateY(6px)}}
.np-right{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
/* Dolny pasek zakładek */
.np-tabs{flex:0 0 72px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2)}
.np-tab{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:15px;font-size:calc(17px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);transition:background .15s var(--np-ease),color .15s}
.np-tab .np-ico{width:24px;height:24px}
.np-tab.on{background:var(--np-ink);color:#fff}
.np-tab:not(.on):active{background:var(--np-surface-2)}
/* Pasek sumy */
.np-sumcard{position:relative;flex:none;padding:14px 20px 16px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow:hidden}
.np-sumcard.scan:after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--np-red);box-shadow:0 0 14px 2px rgba(239,66,25,.6);animation:np-scanline .55s ease-out forwards}
@keyframes np-scanline{from{transform:translateY(0)}to{transform:translateY(170px);opacity:0}}
.np-sum-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);min-width:0}
.np-sum-cashier{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sum-cashier .np-ico{width:17px;height:17px}
.np-sum-doc{display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.np-tag{font-style:normal;font-size:calc(12.5px * var(--np-ts,1));font-weight:600;padding:3px 8px;border-radius:7px;background:var(--np-surface-2);color:var(--np-ink)}
.np-tag.ink{background:var(--np-ink);color:#fff}
.np-buffer{height:60px;margin-top:6px;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;overflow:hidden}
.np-chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-size:calc(20px * var(--np-ts,1));font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;animation:np-chipin .15s var(--np-ease)}
@keyframes np-chipin{from{transform:scale(.85);opacity:0}}
.np-chip small{font-size:calc(13px * var(--np-ts,1));font-weight:650;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.np-chip .np-ico{width:19px;height:19px}
.np-chip.c-qty{background:#DFF5E9;color:#0E7440}
.np-chip.c-price{background:#FDEBDC;color:#A54708}
.np-chip.c-f{background:var(--np-ink);color:#fff;font-family:var(--np-mono)}
.np-chip.m-return{background:#FFE5DE;color:#B02E0E}
.np-chip.m-check{background:#E1EDFF;color:#0A56BD}
.np-entry{display:flex;align-items:center;font-size:46px;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.np-caret{display:inline-block;width:2.5px;height:42px;margin-left:3px;border-radius:1px;background:var(--np-blue);animation:np-blink 1.05s steps(1) infinite}
@keyframes np-blink{50%{opacity:0}}
.np-event{display:flex;align-items:center;gap:10px;min-width:0;font-size:calc(17.5px * var(--np-ts,1));color:var(--np-ink-2);animation:np-fadein .15s var(--np-ease)}
.np-event code{flex:none;font-family:var(--np-mono);font-size:calc(16.5px * var(--np-ts,1));color:var(--np-ink);background:var(--np-surface-2);padding:6px 9px;border-radius:7px}
.np-event > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-event .np-ico{width:20px;height:20px;color:var(--np-green-700)}
.np-event.e-error,.np-event.e-error code{color:var(--np-red)}
.np-event.e-error .np-ico{color:var(--np-red)}
.np-event.e-storno .np-ico{color:var(--np-ink-2)}
.np-event.e-waga .np-ico,.np-event.e-scan .np-ico{color:var(--np-orange)}
.np-buffer-ph{font-size:calc(17px * var(--np-ts,1));color:var(--np-ink-3)}
.np-total-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.np-total-label{display:flex;flex-direction:column;padding-bottom:6px;font-size:calc(19px * var(--np-ts,1));font-weight:600;color:var(--np-ink)}
.np-total-label small{margin-top:3px;font-size:calc(14px * var(--np-ts,1));font-weight:400;color:var(--np-ink-3)}
.np-total{font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:right bottom;animation:np-pop .15s var(--np-ease)}
.np-total small{margin-left:7px;font-size:.4em;font-weight:500;letter-spacing:0;color:var(--np-ink-2)}
@keyframes np-pop{from{transform:scale(.96);opacity:.55}}
.np-sum-disc{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--np-hair);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}
.np-sum-disc > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sum-disc em{font-style:normal;color:var(--np-ink-3)}
.np-sum-disc b{color:var(--np-red);font-weight:650;white-space:nowrap}
.np-sum-disc button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-sum-disc button .np-ico{width:15px;height:15px}
/* Pozycje paragonu */
.np-lines-card{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow:hidden}
.np-lines{position:relative;flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.np-lines::-webkit-scrollbar{display:none}
.np-empty{margin:auto;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--np-ink-3);font-size:calc(16px * var(--np-ts,1));line-height:1.45;text-wrap:pretty}
.np-empty .np-ico{width:46px;height:46px;color:#C8CBD1}
.np-empty .np-ico svg{stroke-width:1.4}
.np-empty b{color:var(--np-ink-2);font-size:calc(19px * var(--np-ts,1));font-weight:600}
.np-line-wrap{position:relative;flex:none;border-radius:var(--np-r-md);overflow:hidden;animation:np-linein .15s var(--np-ease)}
@keyframes np-linein{from{opacity:0;transform:translateY(10px)}}
.np-line-del{position:absolute;top:0;right:0;bottom:0;width:120px;padding-left:12px;background:var(--np-red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:calc(14px * var(--np-ts,1));font-weight:600}
.np-line-del .np-ico{width:22px;height:22px}
.np-line{position:relative;padding:12px 12px 10px 16px;background:var(--np-surface-2);border-radius:var(--np-r-md);transition:transform .15s var(--np-ease),background .15s;touch-action:pan-y;cursor:pointer}
.np-line.dragging{transition:none}
.np-line.sel{background:#E9F1FF;box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-line-wrap.flash .np-line{animation:np-flash .8s ease-out}
@keyframes np-flash{0%{background:#CFF1DE}}
.np-line-r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.np-line-name{min-width:0;font-size:calc(18px * var(--np-ts,1));font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-line-name em{font-style:normal;color:var(--np-orange)}
.np-line-total{flex:none;font-size:calc(19px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.np-line.ret .np-line-total{color:var(--np-orange)}
.np-line-r2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.np-line-calc{display:flex;align-items:center;gap:8px;min-width:0;font-size:calc(15.5px * var(--np-ts,1));color:var(--np-ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.np-adj,.np-ov{flex:none;font-style:normal;font-size:calc(12.5px * var(--np-ts,1));font-weight:650;padding:3px 7px;border-radius:6px}
.np-adj{background:var(--np-red);color:#fff}
.np-adj.up{background:var(--np-orange)}
.np-ov{background:#FDEBDC;color:#A54708}
.np-stepper{flex:none;display:flex;align-items:center;height:38px;border-radius:999px;background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-stepper button{width:46px;height:38px;display:grid;place-items:center;border-radius:999px;transition:background .12s}
.np-stepper button:active{background:var(--np-surface-2)}
.np-stepper button .np-ico{width:20px;height:20px}
.np-stepper button.del{color:var(--np-red)}
.np-stepper i{width:1px;height:18px;background:var(--np-hair-2)}
.np-line-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px;animation:np-fadein .15s var(--np-ease)}
.np-line-actions button{height:42px;border-radius:11px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(15px * var(--np-ts,1));font-weight:550;display:flex;align-items:center;justify-content:center;gap:6px}
.np-line-actions button .np-ico{width:18px;height:18px}
.np-line-actions button.danger{color:var(--np-red)}
.np-razem{flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-radius:var(--np-r-lg);background:var(--np-green);color:#fff;box-shadow:0 8px 22px rgba(34,191,111,.3);font-size:calc(22px * var(--np-ts,1));font-weight:600;transition:transform .12s var(--np-ease),background .15s}
.np-razem > b{font-size:calc(26px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.np-razem:not(:disabled):active{transform:scale(.985);background:var(--np-green-700)}
.np-razem:disabled{background:#CDD1D6;box-shadow:none}
/* Panele kafelków */
.np-panels{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px}
.np-carousel{position:relative;flex:1;min-height:0;margin:-10px -6px;padding:10px 0;overflow:hidden;touch-action:pan-y}
.np-track{display:flex;height:100%;transition:transform .15s var(--np-ease);will-change:transform}
.np-track.swiping{transition:none}
.np-page{flex:0 0 100%;height:100%;display:grid;gap:8px;padding:0 6px}
.np-slot{position:relative;min-width:0;min-height:0;container-type:size}
.np-slot-in{position:absolute;inset:0}
.np-tile{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 13px 12px 12px;border-radius:var(--np-r-md);overflow:hidden;color:#fff;text-align:right;box-shadow:0 1px 2px rgba(16,18,22,.14);transition:transform .14s var(--np-ease)}
.np-panels:not(.edit) .np-slot:not(.empty):active .np-tile,.np-kbrow .np-slot:not(.empty):active .np-tile{transform:scale(.955)}
.np-tile.c-white{background:var(--np-surface);color:var(--np-ink)}
.np-tile.c-gray{background:var(--np-gray)}.np-tile.c-red{background:var(--np-red)}.np-tile.c-orange{background:var(--np-orange)}.np-tile.c-green{background:var(--np-green)}.np-tile.c-blue{background:var(--np-blue)}.np-tile.c-teal{background:var(--np-teal)}.np-tile.c-graphite{background:var(--np-graphite)}
.np-tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.np-tile-ico{width:36px;height:36px}
.np-tile-ico svg{stroke-width:1.5}
.np-tile.k-p{padding:11px}
.np-tile-count{min-width:28px;height:26px;padding:0 9px;border-radius:999px;background:#fff;color:var(--np-ink);font-size:calc(14px * var(--np-ts,1));font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;animation:np-chipin .15s var(--np-ease)}
.np-tile.c-white .np-tile-count{background:var(--np-ink);color:#fff}
.np-tile-f{font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));font-weight:600;line-height:1;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.22)}
.np-tile-label{margin-top:auto;font-size:calc(18px * var(--np-ts,1));font-weight:500;line-height:1.14;letter-spacing:-.005em;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-tile.k-p .np-tile-label{font-size:calc(15.5px * var(--np-ts,1));white-space:normal;-webkit-line-clamp:3;hyphens:auto}
.np-tile.k-p.has-count .np-tile-label{-webkit-line-clamp:2}
.np-tile-price{margin-top:4px;font-size:calc(18px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.np-tile-price small{font-size:calc(12.5px * var(--np-ts,1));font-weight:500;opacity:.8}
@container (max-height:104px){.np-tile{padding:10px 11px}.np-tile-ico{width:28px;height:28px}.np-tile-label{font-size:calc(16px * var(--np-ts,1))}.np-tile.k-p .np-tile-label{font-size:calc(15px * var(--np-ts,1));-webkit-line-clamp:2}.np-tile.k-p.has-count .np-tile-label{-webkit-line-clamp:1}.np-tile-price{font-size:calc(16px * var(--np-ts,1))}}
.np-tile.t-empty{background:transparent;box-shadow:none;border:1.5px dashed transparent;display:grid;place-items:center;color:transparent}
.np-tile.t-empty .np-ico{width:26px;height:26px}
.np-panels.edit .np-tile.t-empty,.np-kbrow .np-tile.t-empty{border-color:rgba(18,20,24,.16);color:var(--np-ink-3)}
.np-panels.edit .np-slot:not(.empty) .np-slot-in{animation:np-wiggle .3s ease-in-out infinite alternate}
.np-panels.edit .np-slot:nth-child(2n) .np-slot-in{animation-direction:alternate-reverse;animation-duration:.34s}
.np-panels.edit .np-slot:nth-child(3n) .np-slot-in{animation-duration:.27s}
@keyframes np-wiggle{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.np-panels.edit .np-tile{cursor:grab}
.np-slot.from .np-slot-in{opacity:.25}
.np-slot.over .np-tile{box-shadow:0 0 0 3px var(--np-blue)}
.np-slot.empty.over .np-tile{border-color:var(--np-blue);background:rgba(10,124,255,.07)}
.np-tile-rm{position:absolute;top:-7px;left:-7px;z-index:3;width:26px;height:26px;border-radius:50%;background:#8A8D94;color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.np-tile-rm .np-ico{width:16px;height:16px}
.np-tile-rm .np-ico svg{stroke-width:3}
.np-ghost{position:absolute;z-index:20;container-type:size;pointer-events:none;transform:scale(1.07) rotate(-1.5deg)}
.np-pagebar{flex:0 0 26px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 4px}
.np-pagebar-name{font-size:calc(15px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-dots{display:flex;align-items:center}
.np-dots button{padding:8px 4px}
.np-dots i{display:block;width:8px;height:8px;border-radius:999px;background:#C3C6CC;transition:width .15s var(--np-ease),background .15s}
.np-dots button.on i{width:24px;background:var(--np-ink)}
.np-pagebar-act{justify-self:end}
.np-pill-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;font-size:calc(14.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2);background:rgba(18,20,24,.06)}
.np-pill-btn .np-ico{width:16px;height:16px}
.np-pill-btn.ink{background:var(--np-ink);color:#fff}
/* Klawiatura 1:1 */
.np-kbv{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.np-kbrow{flex:0 0 116px;display:grid;gap:8px}
.np-kbrow .np-slot{display:block;padding:0}
.np-kb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}
.np-key{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1),0 2px 0 rgba(18,20,24,.06);font-size:40px;font-weight:400;font-variant-numeric:tabular-nums;transition:transform .08s}
.np-key:active,.np-key.press{transform:scale(.965) translateY(1px)}
.np-key.k-fn{background:var(--np-orange);color:#fff;font-size:calc(26px * var(--np-ts,1));font-weight:600}
.np-key.k-esc{background:var(--np-red);color:#fff}
.np-key.k-ok{background:var(--np-green);color:#fff}
.np-key.k-logo{background:var(--np-graphite);color:#fff}
.np-key .np-ico{width:28px;height:28px}
.np-key-cap{font-size:calc(14px * var(--np-ts,1));font-weight:700;letter-spacing:.06em}
.np-key-big{font-size:calc(34px * var(--np-ts,1));font-weight:600}
.np-key-xw{position:absolute;inset:12% 20%;display:flex;flex-direction:column;justify-content:space-between;line-height:1}
.np-key-xw:before{content:"";position:absolute;left:50%;top:50%;width:70%;height:2px;border-radius:1px;background:currentColor;opacity:.9;transform:translate(-50%,-50%) rotate(-28deg)}
.np-key-xw b{align-self:flex-start;font-size:calc(27px * var(--np-ts,1));font-weight:600}
.np-key-xw > span{align-self:flex-end;font-size:calc(17px * var(--np-ts,1));font-weight:600}
.np-key-hint{position:absolute;top:9px;right:11px;font-family:var(--np-mono);font-size:calc(12px * var(--np-ts,1));font-weight:600;letter-spacing:0;opacity:.5}
/* Wspólne: boczna lista */
.np-side{min-height:0;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);overflow-y:auto;scrollbar-width:none}
.np-side::-webkit-scrollbar{display:none}
.np-side-item{flex:none;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:13px;font-size:calc(16.5px * var(--np-ts,1));font-weight:550;text-align:left;color:var(--np-ink);transition:background .15s}
.np-side-item > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-side-item > .np-ico{width:21px;height:21px;color:var(--np-ink-2)}
.np-side-item small{margin-left:auto;font-size:calc(14px * var(--np-ts,1));font-weight:500;color:var(--np-ink-3);font-variant-numeric:tabular-nums}
.np-side-item:not(.on):active{background:var(--np-surface-2)}
.np-side-item.on{background:var(--np-ink);color:#fff}
.np-side-item.on > .np-ico,.np-side-item.on small{color:rgba(255,255,255,.7)}
.np-side-item.danger{color:var(--np-red)}
.np-side-chip{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff}
.np-side-chip .np-ico{width:18px;height:18px}
.np-side-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--np-hair);display:flex;flex-direction:column;gap:6px}
.np-side-user{display:flex;align-items:center;gap:10px;padding:8px 10px}
.np-side-user b{display:block;font-size:calc(15px * var(--np-ts,1));font-weight:600}
.np-side-user small{display:block;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-2);margin-top:1px}
/* Towary */
.np-goods{position:absolute;inset:0;display:grid;grid-template-columns:238px minmax(0,1fr);gap:12px}
.np-goods-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.np-search{flex:none;display:flex;align-items:center;gap:10px;height:54px;padding:0 10px 0 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-2);cursor:text;transition:none}
.np-search > .np-ico{width:22px;height:22px;color:var(--np-ink-3)}
.np-search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:calc(19px * var(--np-ts,1));color:var(--np-ink)}
.np-search input::placeholder{color:var(--np-ink-3)}
.np-search.focus,.np-search:focus-within{box-shadow:0 0 0 2.5px var(--np-blue),var(--np-shadow-2)}
.np-search.sm{height:46px;box-shadow:none;background:var(--np-surface);border:1px solid var(--np-hair)}
.np-search.sm input{font-size:calc(17px * var(--np-ts,1))}
.np-search-x{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--np-surface-2);color:var(--np-ink-2)}
.np-search-x .np-ico{width:16px;height:16px}
.np-glist{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:0 6px 6px;scrollbar-width:thin}
.np-ghead,.np-grow{display:grid;grid-template-columns:44px minmax(0,1fr) 46px 88px 40px;align-items:center;gap:10px}
.np-ghead{position:sticky;top:0;z-index:1;padding:14px 12px 10px;background:var(--np-surface);font-size:calc(12.5px * var(--np-ts,1));font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--np-ink-3)}
.np-ghead-title{grid-column:1/3;display:flex;align-items:baseline;gap:8px;font-size:calc(19px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em;text-transform:none;color:var(--np-ink)}
.np-ghead-title small{font-size:calc(14px * var(--np-ts,1));font-weight:500;color:var(--np-ink-3)}
.np-ghead .r{text-align:right}
.np-grow{width:100%;min-height:64px;padding:8px 12px;border-radius:13px;cursor:pointer;transition:background .12s}
.np-grow:active{background:#DFF5E9}
.np-grow + .np-grow{box-shadow:0 -1px 0 var(--np-hair)}
.np-grow-ico{width:44px;height:44px;border-radius:12px;background:var(--np-surface-2);display:grid;place-items:center;color:var(--np-ink-2)}
.np-grow-ico .np-ico{width:24px;height:24px}
.np-grow-main{min-width:0}
.np-grow-name{display:flex;align-items:center;gap:8px;min-width:0;font-size:calc(17px * var(--np-ts,1));font-weight:550}
.np-grow-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-grow-count{flex:none;font-style:normal;font-size:calc(12.5px * var(--np-ts,1));font-weight:700;padding:2px 8px;border-radius:999px;background:var(--np-ink);color:#fff}
.np-grow-code{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--np-mono);font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3)}
.np-grow-vat{justify-self:start;font-size:calc(13px * var(--np-ts,1));font-weight:600;padding:3px 8px;border-radius:7px;background:var(--np-surface-2);color:var(--np-ink-2);font-variant-numeric:tabular-nums}
.np-grow-price{text-align:right;font-size:calc(18px * var(--np-ts,1));font-weight:700;font-variant-numeric:tabular-nums}
.np-grow-price small{display:block;font-size:calc(12.5px * var(--np-ts,1));font-weight:500;color:var(--np-ink-3)}
.np-star{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#CDD0D5;transition:color .15s,transform .15s}
.np-star:active{transform:scale(.85)}
.np-star.on{color:var(--np-orange)}
.np-star.on svg{fill:currentColor}
.np-star .np-ico{width:23px;height:23px}
.np-glist-empty{padding:60px 20px;text-align:center;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-3);text-wrap:pretty}
/* Klawiatura ekranowa */
.np-osk{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:var(--np-r-lg);background:#D5D8DD;animation:np-oskin .15s var(--np-ease)}
@keyframes np-oskin{from{transform:translateY(20px);opacity:0}}
.np-osk-row{display:flex;justify-content:center;gap:6px}
.np-osk-k{flex:1 1 0;max-width:54px;height:44px;border-radius:9px;background:var(--np-surface);box-shadow:0 1px 0 rgba(0,0,0,.18);display:grid;place-items:center;font-size:calc(19px * var(--np-ts,1));font-weight:450;text-align:center}
.np-osk-k.alt{background:#EDEFF2}
.np-osk-k.wide{flex:1.8 1 0;max-width:120px;font-size:calc(15px * var(--np-ts,1));font-weight:600}
.np-osk-k.space{flex:6 1 0;max-width:none;font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}
.np-osk-k:active{background:#BFC3CA}
.np-osk-k .np-ico{width:22px;height:22px}
/* Menu */
.np-menu{position:absolute;inset:0;display:grid;grid-template-columns:232px minmax(0,1fr);gap:12px}
.np-menu-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.np-menu-title{flex:0 0 38px;display:flex;align-items:center;padding:0 4px;font-size:calc(26px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-menu-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
.np-mi{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);text-align:left;transition:transform .12s var(--np-ease);animation:np-fadein .15s var(--np-ease)}
.np-mi:active{transform:scale(.96)}
.np-mi-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.np-mi-ico .np-ico{width:21px;height:21px}
.np-mi-badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--np-red);color:#fff;font-size:calc(12.5px * var(--np-ts,1));font-weight:700;display:grid;place-items:center}
.np-mi-label{font-size:calc(15.5px * var(--np-ts,1));font-weight:600;line-height:1.2;text-wrap:pretty}
/* Arkusze i dialogi */
.np-sheet-bg{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,20,24,.3);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);animation:np-fade .15s ease-out}
@keyframes np-fade{from{opacity:0}}
.np-sheet{position:relative;max-width:calc(100% - 48px);max-height:calc(100% - 40px);display:flex;flex-direction:column;border-radius:28px;background:#F6F7F9;box-shadow:var(--np-shadow-3);animation:np-up .15s var(--np-ease)}
@keyframes np-up{from{opacity:0;transform:translateY(26px) scale(.98)}}
.np-dialog{width:540px;padding:30px 28px 24px;align-items:center;text-align:center}
.np-dlg-ico{width:68px;height:68px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:calc(36px * var(--np-ts,1));font-weight:700;line-height:1}
.np-dlg-ico .np-ico{width:34px;height:34px}
.np-dlg-ico .np-ico svg{stroke-width:2.6}
.np-dlg-ico.big{width:96px;height:96px}
.np-dlg-ico.big .np-ico{width:48px;height:48px}
.t-success{background:var(--np-green)}.t-warning{background:var(--np-orange)}.t-error{background:var(--np-red)}.t-question{background:var(--np-blue)}.t-info{background:var(--np-graphite)}.t-power{background:var(--np-graphite)}.t-progress{background:transparent}
.np-dlg-title{margin-top:16px;font-size:calc(25px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.np-dlg-desc{margin-top:8px;font-size:calc(17px * var(--np-ts,1));line-height:1.45;color:var(--np-ink-2);text-wrap:pretty}
.np-dlg-rows{width:100%;margin-top:18px;padding:2px 18px;border-radius:var(--np-r-md);background:var(--np-surface);text-align:left}
.np-dlg-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:calc(17px * var(--np-ts,1));font-variant-numeric:tabular-nums}
.np-dlg-row + .np-dlg-row{border-top:1px solid var(--np-hair)}
.np-dlg-row > span{color:var(--np-ink-2)}
.np-dlg-row > b{font-weight:600;text-align:right}
.np-dlg-actions{width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-top:22px}
.np-btn{height:58px;padding:0 16px;border-radius:var(--np-r-md);background:#E4E6EA;font-size:calc(18px * var(--np-ts,1));font-weight:600;color:var(--np-ink);text-align:center;transition:transform .1s,opacity .15s}
.np-btn:not(:disabled):active{transform:scale(.98)}
.np-btn.green{background:var(--np-green);color:#fff}.np-btn.red{background:var(--np-red);color:#fff}.np-btn.blue{background:var(--np-blue);color:#fff}.np-btn.ink{background:var(--np-ink);color:#fff}
.np-btn.wide{width:100%}
.np-btn:disabled{opacity:.4}
.np-spinner{width:58px;height:58px;flex:none;border-radius:50%;border:5px solid #DDE0E5;border-top-color:var(--np-blue);animation:np-spin .8s linear infinite}
.np-spinner.big{width:84px;height:84px;border-width:6px}
@keyframes np-spin{to{transform:rotate(360deg)}}
.np-progress{width:100%;height:6px;margin-top:24px;border-radius:3px;background:#E1E4E8;overflow:hidden}
.np-progress i{display:block;width:40%;height:100%;border-radius:3px;background:var(--np-blue);animation:np-prog 1.1s ease-in-out infinite}
@keyframes np-prog{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.np-sheet-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.np-seg{flex:none;display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(18,20,24,.07)}
.np-seg button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-size:calc(16.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2);text-align:center;transition:background .15s,color .15s}
.np-seg button .np-ico{width:19px;height:19px}
.np-seg button.on{background:var(--np-surface);color:var(--np-ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.np-seg button:disabled{opacity:.35}
.np-seg.full{margin-top:16px}
/* Kwota / numpad w arkuszu */
.np-amount{width:470px;padding:26px 24px 22px}
.np-amount-title{text-align:center;font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em}
.np-amount-desc{margin-top:6px;text-align:center;font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-amount-field{margin-top:18px;height:84px;padding:0 22px;border-radius:var(--np-r-md);background:var(--np-surface);display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px var(--np-blue);overflow:hidden;white-space:nowrap}
.np-amount-field.err{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-amount-field small{font-size:calc(22px * var(--np-ts,1));font-weight:400;color:var(--np-ink-2)}
.np-amount-field .ph{color:var(--np-ink-3)}
.np-amount-err{height:24px;padding-top:6px;text-align:center;font-size:calc(14.5px * var(--np-ts,1));font-weight:500;color:var(--np-red)}
.np-amount .np-numpad{height:290px;margin-top:4px}
.np-presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.np-presets button{height:46px;border-radius:12px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(17px * var(--np-ts,1));font-weight:600;text-align:center}
.np-presets button.on{background:var(--np-ink);color:#fff}
.np-rabat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.np-rabat-grid button{height:76px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(24px * var(--np-ts,1));font-weight:650;color:var(--np-red);text-align:center;font-variant-numeric:tabular-nums;transition:transform .1s}
.np-rabat-grid button:active{transform:scale(.96)}
/* Edytor kafelka */
.np-editor{width:1000px;height:680px;padding:0;overflow:hidden}
.np-ed-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px;padding:0 22px;border-bottom:1px solid var(--np-hair);background:var(--np-surface)}
.np-ed-title{text-align:center;font-size:calc(19px * var(--np-ts,1));font-weight:650;white-space:nowrap}
.np-ed-title > span{display:block;margin-top:2px;font-size:calc(13.5px * var(--np-ts,1));font-weight:400;color:var(--np-ink-2)}
.np-btn-text{justify-self:start;height:44px;padding:0 6px;font-size:calc(18px * var(--np-ts,1));font-weight:500;color:var(--np-blue)}
.np-btn-text.strong{justify-self:end;font-weight:650}
.np-ed-body{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr)}
.np-ed-side{display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-right:1px solid var(--np-hair)}
.np-ed-label{font-size:calc(12.5px * var(--np-ts,1));font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-ed-preview{position:relative;width:150px;height:140px;margin-bottom:8px}
.np-swatches{display:grid;grid-template-columns:repeat(4,44px);gap:10px;margin-bottom:8px}
.np-swatch{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:calc(15px * var(--np-ts,1));font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
.np-swatch.c-gray{background:var(--np-gray)}.np-swatch.c-white{background:var(--np-surface);color:var(--np-ink-2)}.np-swatch.c-red{background:var(--np-red)}.np-swatch.c-orange{background:var(--np-orange)}.np-swatch.c-green{background:var(--np-green)}.np-swatch.c-blue{background:var(--np-blue)}.np-swatch.c-teal{background:var(--np-teal)}.np-swatch.c-graphite{background:var(--np-graphite)}
.np-swatch.auto{background-image:linear-gradient(135deg,rgba(255,255,255,.35) 50%,transparent 50%)}
.np-swatch.on{box-shadow:0 0 0 3px #F6F7F9,0 0 0 5.5px var(--np-blue);transform:scale(.94)}
.np-ed-clear{margin-top:auto;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:#FFE9E3;color:var(--np-red);font-size:calc(16px * var(--np-ts,1));font-weight:600}
.np-ed-clear .np-ico{width:19px;height:19px}
.np-ed-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px 20px 0}
.np-chips{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.np-chips::-webkit-scrollbar{display:none}
.np-chips button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--np-surface);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(14.5px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2);white-space:nowrap}
.np-chips button.on{background:var(--np-ink);color:#fff;box-shadow:none}
.np-ed-list{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.np-ed-row{flex:none;display:grid;grid-template-columns:42px minmax(0,1fr) auto 28px;align-items:center;gap:12px;min-height:58px;padding:6px 10px;border-radius:13px;text-align:left;transition:background .12s}
.np-ed-row:active{background:#E9EBEE}
.np-ed-row.on{background:#E6F0FF}
.np-ed-row-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--np-surface);color:var(--np-ink-2);box-shadow:var(--np-shadow-1)}
.np-ed-row-ico[class*="bg-"]{color:#fff;box-shadow:none}
.np-ed-row-ico .np-ico{width:22px;height:22px}
.np-ed-row-main{min-width:0}
.np-ed-row-main b{display:block;font-size:calc(16.5px * var(--np-ts,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ed-row-main small{display:block;margin-top:2px;font-size:calc(13px * var(--np-ts,1));color:var(--np-ink-3);font-family:var(--np-mono)}
.np-ed-row-val{font-size:calc(16px * var(--np-ts,1));font-weight:650;font-variant-numeric:tabular-nums}
.np-ed-row-val.mono{font-family:var(--np-mono);color:var(--np-ink-2)}
.np-ed-check{color:var(--np-blue)}
.np-ed-check .np-ico{width:22px;height:22px}
.np-ed-check .np-ico svg{stroke-width:2.6}
.np-ed-empty{padding:40px;text-align:center;color:var(--np-ink-3)}
/* Płatność */
.np-pay{width:980px;height:660px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) auto;gap:18px 22px}
.np-pay-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.np-pay-title{font-size:calc(28px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-pay-title small{display:block;margin-top:2px;font-size:calc(15px * var(--np-ts,1));font-weight:400;letter-spacing:0;color:var(--np-ink-2)}
.np-pay-head .np-round-btn{background:#E6E8EC}
.np-pay-left{min-height:0;display:flex;flex-direction:column;gap:14px}
.np-pay-total{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 22px;border-radius:var(--np-r-lg);background:var(--np-ink);color:#fff}
.np-pay-total > span{padding-bottom:6px;font-size:calc(17px * var(--np-ts,1));color:rgba(255,255,255,.7)}
.np-pay-total > b{font-size:58px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.np-pay-total > b small{margin-left:7px;font-size:calc(24px * var(--np-ts,1));font-weight:500;letter-spacing:0;color:rgba(255,255,255,.7)}
.np-methods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.np-method{height:90px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:calc(16px * var(--np-ts,1));font-weight:600;text-align:center;transition:background .15s,color .15s}
.np-method .np-ico{width:28px;height:28px}
.np-method.on{background:var(--np-green);color:#fff;box-shadow:none}
.np-tender{border-radius:var(--np-r-md);background:var(--np-surface);padding:0 22px}
.np-tender-row{display:flex;justify-content:space-between;align-items:center;height:66px;font-size:calc(18px * var(--np-ts,1));color:var(--np-ink-2)}
.np-tender-row + .np-tender-row{border-top:1px solid var(--np-hair)}
.np-tender-row > b{font-size:calc(32px * var(--np-ts,1));font-weight:600;color:var(--np-ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.np-tender-row > b.ph{color:var(--np-ink-3);font-weight:400}
.np-tender-row > b.change{color:var(--np-green-700)}
.np-tender-row > b.short{color:var(--np-red);font-size:calc(22px * var(--np-ts,1))}
.np-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.np-quick button{height:52px;border-radius:13px;background:var(--np-surface);box-shadow:var(--np-shadow-1);font-size:calc(17px * var(--np-ts,1));font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.np-quick button.on{background:var(--np-ink);color:#fff;box-shadow:none}
.np-pay-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-radius:var(--np-r-lg);background:var(--np-surface);text-align:center}
.np-pay-info .np-ico{width:52px;height:52px;margin-bottom:6px;color:var(--np-green)}
.np-pay-info .np-ico svg{stroke-width:1.5}
.np-pay-info b{font-size:calc(22px * var(--np-ts,1));font-weight:650}
.np-pay-info > span{font-size:calc(16px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pay-right{min-height:0;display:flex}
.np-pay-right .np-numpad{flex:1}
.np-pay-right.off{opacity:.3;pointer-events:none}
.np-pay-foot{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.np-pay-foot .np-btn{height:64px;font-size:calc(20px * var(--np-ts,1))}
.np-pay-status{width:620px;height:auto;padding:44px 40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.np-pay-status-title{margin-top:24px;font-size:calc(28px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-pay-status-desc{margin-top:8px;font-size:calc(17px * var(--np-ts,1));color:var(--np-ink-2)}
.np-change{width:100%;margin-top:24px;padding:18px 24px;border-radius:var(--np-r-lg);background:var(--np-surface);display:flex;justify-content:space-between;align-items:flex-end}
.np-change > span{padding-bottom:8px;font-size:calc(19px * var(--np-ts,1));color:var(--np-ink-2)}
.np-change > b{font-size:60px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--np-green-700);font-variant-numeric:tabular-nums}
.np-change > b small{margin-left:6px;font-size:calc(26px * var(--np-ts,1));font-weight:500;color:var(--np-ink-2)}
.np-pay-status .np-btn.wide{margin-top:24px;height:62px;font-size:calc(20px * var(--np-ts,1))}
/* Komunikaty */
.np-toast{position:absolute;top:50px;left:50%;z-index:80;display:flex;align-items:center;gap:10px;max-width:760px;padding:12px 20px 12px 16px;border-radius:999px;background:rgba(22,23,26,.92);color:#fff;font-size:calc(17px * var(--np-ts,1));font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transform:translateX(-50%);animation:np-toastin .15s var(--np-ease);white-space:nowrap}
.np-toast > span{overflow:hidden;text-overflow:ellipsis}
@keyframes np-toastin{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
.np-toast .np-ico{width:20px;height:20px}
.np-toast.t-ok .np-ico{color:#5BE39C}
.np-toast.t-err{background:rgba(239,66,25,.96)}

/* Narzędzia kolorów tła — na końcu, żeby wygrywały z tłami komponentów */
.bg-gray{background:var(--np-gray)}.bg-red{background:var(--np-red)}.bg-orange{background:var(--np-orange)}.bg-green{background:var(--np-green)}.bg-blue{background:var(--np-blue)}.bg-teal{background:var(--np-teal)}.bg-graphite{background:var(--np-graphite)}.bg-white{background:var(--np-surface-2)}
/* Paragon z lewej → listy grup (Towary, Menu) przy prawej krawędzi ekranu */
.np-sale.rl .np-goods{grid-template-columns:minmax(0,1fr) 238px}.np-sale.rl .np-menu{grid-template-columns:minmax(0,1fr) 232px}.np-sale.rl .np-goods > .np-side,.np-sale.rl .np-menu > .np-side{order:2}
/* Bez ramki (APK / ?ramka=0): tło jak aplikacja; ekran ładowania przed startem Reacta */
body.np-bare{background:var(--np-bg)}
.np-preload{position:fixed;inset:0;display:grid;place-items:center;background:#050506;color:#fff}
.np-preload .np-logo.big{animation:np-fade 1.2s ease-in-out infinite alternate}
/* Klawisz F — 3 × 3 programowalnych pól nad strefą roboczą */
.np-fsheet-bg{position:absolute;inset:-6px;z-index:30;display:flex;border-radius:var(--np-r-xl);background:rgba(236,238,241,.55);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);animation:np-fade .15s ease-out}
.np-fsheet{flex:1;display:flex;flex-direction:column;gap:12px;margin:6px;padding:16px;border-radius:var(--np-r-xl);background:rgba(255,255,255,.78);box-shadow:var(--np-shadow-3);animation:np-up .15s var(--np-ease)}
.np-fsheet-head{flex:none;display:flex;align-items:center;gap:10px}
.np-fsheet-title{flex:1;min-width:0;font-size:calc(24px * var(--np-ts,1));font-weight:650;letter-spacing:-.015em}
.np-fsheet-title small{display:block;margin-top:2px;font-size:calc(14.5px * var(--np-ts,1));font-weight:400;letter-spacing:0;color:var(--np-ink-2)}
.np-fsheet-head .np-pill-btn{height:40px;padding:0 16px;font-size:calc(15.5px * var(--np-ts,1))}
.np-fgrid3{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.np-fgrid3 .np-slot{display:block;padding:0}
.np-fgrid3 .np-tile{padding:16px}
.np-fgrid3 .np-tile-ico{width:46px;height:46px}
.np-fgrid3 .np-tile-label{font-size:calc(22px * var(--np-ts,1))}
.np-fgrid3 .np-tile.k-p .np-tile-label{font-size:calc(19px * var(--np-ts,1))}
.np-fgrid3 .np-tile-price{font-size:calc(21px * var(--np-ts,1))}
.np-fgrid3 .np-tile.t-empty{border-color:rgba(18,20,24,.16);color:var(--np-ink-3)}
.np-fgrid3:not(.edit) .np-slot:not(.empty):active .np-tile{transform:scale(.97)}
.np-fgrid3.edit .np-slot:not(.empty) .np-slot-in{animation:np-wiggle .3s ease-in-out infinite alternate}
.np-fgrid3.edit .np-slot:nth-child(2n) .np-slot-in{animation-direction:alternate-reverse;animation-duration:.34s}

.np-ed-pickhead{flex:none;display:flex;align-items:center;gap:10px}

.np-pict-grid{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:2px 8px 16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:88px;gap:6px;align-content:start}

/* Pasek płatności pod paragonem: 3 szybkie płatności + Razem (po prawej) */

.np-method{height:76px}
.np-tender-row{height:58px}

.np-pay-hint{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:13px;background:rgba(18,20,24,.04);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2)}

.np-pay-left{gap:10px}
.np-pay-total{padding:14px 20px;align-items:center;gap:16px}
.np-pay-total > span{flex:1;min-width:0;padding-bottom:0}

.np-pay-total > b{flex:none;font-size:52px}
.np-pays{margin-top:0}
.np-method{height:62px;flex-direction:row;gap:8px}

.np-tender-row{height:54px}
.np-quick button,.np-pay-hint{height:48px}
/* Menu — siatka dynamiczna, NoviCloud, Ustawienia, listy */
.np-menu-grid{grid-auto-rows:minmax(0,1fr)}
.np-menu-grid.dim{opacity:.4}
.np-mi-label{hyphens:auto}
.np-cloud{flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1)}

.np-check > i .np-ico{width:16px;height:16px}

.np-check.on > i{background:var(--np-blue);box-shadow:none;color:#fff}

.np-set-list{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:0 16px;scrollbar-width:thin}

.np-list-card{flex:1;min-height:0;overflow-y:auto;border-radius:var(--np-r-lg);background:var(--np-surface);box-shadow:var(--np-shadow-2);padding:4px 8px}

.np-list-row > .np-ico{width:18px;height:18px;color:var(--np-ink-3)}

.np-menu{grid-template-columns:clamp(180px,32%,232px) minmax(0,1fr)}
.np-sale.rl .np-menu{grid-template-columns:minmax(0,1fr) clamp(180px,32%,232px)}
.np-goods-main{container-type:inline-size}
@container (max-width:470px){
  .np-ghead,.np-grow{grid-template-columns:minmax(0,1fr) auto 36px}
  .np-grow-ico,.np-grow-vat,.np-ghead > span:nth-child(2){display:none}
  .np-ghead-title{grid-column:1/2}
}
.np-tabs{container-type:inline-size}
@container (max-width:680px){.np-tab .np-ico{display:none}}
.np-side{container-type:inline-size}
@container (max-width:200px){.np-side-chip{width:28px;height:28px}.np-side-item{gap:9px;padding:0 9px}}
/* Napisy na kafelkach: rosną z tekstem, ale nie bardziej niż pozwala szerokość kafelka (cqi) */
.np-tile-label{font-size:min(calc(18px * var(--np-ts,1)), 17cqi);hyphens:auto}
.np-tile.k-p .np-tile-label{font-size:min(calc(15.5px * var(--np-ts,1)), 15cqi)}
.np-tile-price{font-size:min(calc(18px * var(--np-ts,1)), 18cqi)}
.np-tile.big .np-tile-label{font-size:min(calc(24px * var(--np-ts,1)), 10.5cqi)}
.np-tile.big.k-p .np-tile-label{font-size:min(calc(21px * var(--np-ts,1)), 9.5cqi)}
.np-tile.big .np-tile-price{font-size:min(calc(26px * var(--np-ts,1)), 12cqi)}
.np-qpay .np-tile-label{font-size:min(calc(12.5px * var(--np-ts,1)), 15cqi)}
.np-fgrid3 .np-tile-label{font-size:min(calc(22px * var(--np-ts,1)), 11cqi)}
.np-menu-grid.sq .np-mi{container-type:inline-size}
.np-menu-grid.sq .np-mi-label{font-size:min(calc(13px * var(--np-ts,1)), 12.5cqi);hyphens:auto}
.np-tile.tall:not(.big) .np-tile-label{-webkit-line-clamp:5}
.np-tile.tall:not(.big) .np-tile-ico{width:40px;height:40px}
.np-qpay .np-tile-label{font-size:min(calc(12.5px * var(--np-ts,1)), 17cqi)}
/* Wskaźnik przewijania (ScrollArea) */
.np-sa{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.np-sa > .np-sa-in{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.np-sa > .np-sa-in::-webkit-scrollbar{display:none}
.np-sa.fade-b > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent)}
.np-sa.fade-t > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px);mask-image:linear-gradient(to bottom,transparent,#000 28px)}
.np-sa.fade-t.fade-b > .np-sa-in{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 44px),transparent)}
.np-sa-bar{position:absolute;top:8px;bottom:8px;right:4px;width:5px;border-radius:3px;background:rgba(18,20,24,.06);opacity:0;transition:opacity .15s,width .15s;z-index:2;pointer-events:none}
.np-sa.can .np-sa-bar{opacity:1}
.np-sa-bar > i{position:absolute;top:0;left:0;right:0;border-radius:3px;background:rgba(18,20,24,.3);transition:background .15s;pointer-events:auto;cursor:grab;touch-action:none}
.np-sa-bar > i:before{content:"";position:absolute;inset:-6px -12px}
.np-sa.active .np-sa-bar{width:7px}
.np-sa.active .np-sa-bar > i{background:rgba(18,20,24,.55)}
.np-sa.v-out .np-sa-bar{right:-9px}
.np-sa-more{position:absolute;left:50%;bottom:10px;z-index:3;display:flex;align-items:center;gap:4px;height:32px;padding:0 14px 0 10px;border-radius:999px;background:rgba(22,23,26,.9);color:#fff;font-size:calc(13.5px * var(--np-ts,1));font-weight:600;transform:translateX(-50%);box-shadow:0 6px 16px rgba(0,0,0,.18);animation:np-fade .15s}
.np-sa-more .np-ico{width:18px;height:18px}
.np-sa-more:active{transform:translateX(-50%) scale(.95)}
.np-sa > .np-set-list,.np-sa > .np-list-card,.np-sa > .np-glist{scrollbar-width:none}
.np-tile-price{flex:none}
.np-tile-top{flex:none}
@container (max-height:72px){.np-tile{padding:7px 9px}.np-tile.k-f .np-tile-ico{width:22px;height:22px}.np-tile-top{min-height:0}.np-tile.k-p .np-tile-top{display:none}.np-tile-price{margin-top:2px}.np-tile-price small{display:none}}
/* Wydajność (słabe urządzenie): naciśnięcie = transform + przyciemnienie nakładką (opacity), bez filter/box-shadow */
.np-ghost .np-tile{box-shadow:0 18px 30px rgba(0,0,0,.25)}
.np-btn{position:relative}
.np-tile::after,.np-key::after,.np-mi::after,.np-btn::after,.np-nk::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
.np-nk{position:relative}
.np-panels:not(.edit) .np-slot:not(.empty):active .np-tile::after,.np-kbrow .np-slot:not(.empty):active .np-tile::after,.np-qpay .np-slot:not(.empty):active .np-tile::after,.np-fgrid3:not(.edit) .np-slot:not(.empty):active .np-tile::after,.np-key:active::after,.np-key.press::after,.np-menu-grid.sq .np-mi:active::after,.np-btn:not(:disabled):active::after,.np-nk:active::after{opacity:.1}
.np-tile-count{display:none}
/* ═══ Pozycja paragonu: duże − / + po bokach (mniej pomyłek) ═══ */
.np-line.qb{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:stretch;padding:0;min-height:68px}
.np-line-body{min-width:0;padding:10px 12px 9px;display:flex;flex-direction:column;justify-content:center}
.np-line.qb .np-line-r2{margin-top:5px}
.np-line.qb .np-line-total{font-size:calc(19px * var(--np-ts,1))}
.np-qb{display:grid;place-items:center;background:rgba(18,20,24,.055);color:var(--np-ink);transition:background .1s,transform .1s}
.np-qb:first-child{border-radius:var(--np-r-md) 0 0 var(--np-r-md);box-shadow:inset -1px 0 0 var(--np-hair)}
.np-qb:last-child{border-radius:0 var(--np-r-md) var(--np-r-md) 0;box-shadow:inset 1px 0 0 var(--np-hair)}
.np-qb .np-ico{width:26px;height:26px}
.np-qb .np-ico svg{stroke-width:2.2}
.np-qb:active{background:rgba(18,20,24,.14)}
.np-qb.del{color:var(--np-red)}
.np-line.sel .np-qb{background:rgba(10,124,255,.1)}
/* ═══ Towary: pasek akcji, aktywne filtry, edycja ═══ */
.np-gbar{flex:none;display:flex;align-items:center;gap:6px;min-width:0}
.np-gbar-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding-left:4px}
.np-gbar-title b{font-size:calc(19px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gbar-title small{font-size:calc(14px * var(--np-ts,1));color:var(--np-ink-3)}
.np-gbar .np-pill-btn{flex:none;height:38px;padding:0 12px;font-size:calc(14.5px * var(--np-ts,1));background:var(--np-surface);box-shadow:var(--np-shadow-1);color:var(--np-ink)}
.np-gbar .np-pill-btn.ink{background:var(--np-ink);color:#fff}
.np-gbar .np-pill-btn.green{background:var(--np-green);color:#fff;box-shadow:none}
.np-gbar .np-pill-btn .np-ico{width:17px;height:17px}
.np-gbar-n{font-style:normal;min-width:20px;height:20px;padding:0 6px;margin-left:2px;border-radius:999px;background:#fff;color:var(--np-ink);font-size:calc(12px * var(--np-ts,1));font-weight:700;display:grid;place-items:center}
.np-gactive{flex:none;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 12px;border-radius:12px;background:#E6F0FF;color:#0A56BD;font-size:calc(14px * var(--np-ts,1));font-weight:550}
.np-gactive > .np-ico{width:16px;height:16px}
.np-gactive > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-gactive > button{height:28px;padding:0 10px;border-radius:999px;background:rgba(10,86,189,.12);font-size:calc(13px * var(--np-ts,1));font-weight:600}
.np-ghead,.np-grow{grid-template-columns:44px minmax(0,1fr) 46px 86px 40px 40px}
.np-grow.manage{grid-template-columns:44px minmax(0,1fr) 46px 86px 40px}
.np-grow.off{opacity:.55}
.np-grow.off .np-grow-name{text-decoration:line-through}
.np-gedit{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--np-ink-3)}
.np-gedit .np-ico{width:20px;height:20px}
.np-gedit:active{background:var(--np-surface-2)}
@container (max-width:470px){.np-ghead,.np-grow{grid-template-columns:minmax(0,1fr) auto 36px 36px}.np-grow.manage{grid-template-columns:minmax(0,1fr) auto 36px}}
.np-sub-body{position:relative;flex:1;min-height:0}
.np-pill-btn.danger{color:var(--np-red)}
/* ═══ Filtry towarów ═══ */
.np-gfilter{width:min(560px,calc(100% - 24px));padding:22px 22px 18px;gap:16px}
.np-gf-head{display:flex;align-items:center;justify-content:space-between}
.np-gf-head b{font-size:calc(22px * var(--np-ts,1));font-weight:650}
.np-gf-sec{display:flex;flex-direction:column;gap:8px}
.np-gf-sec > span{display:flex;align-items:center;justify-content:space-between;font-size:calc(12.5px * var(--np-ts,1));font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--np-ink-3)}
.np-gf-chips{display:flex;flex-wrap:wrap;gap:8px}
.np-fchip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 10px;border-radius:12px;background:var(--np-surface);box-shadow:inset 0 0 0 1.5px var(--np-hair-2);font-size:calc(15.5px * var(--np-ts,1));font-weight:550;color:var(--np-ink-2)}
.np-fchip > i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--np-ink-3);color:transparent}
.np-fchip > i .np-ico{width:15px;height:15px}
.np-fchip > i .np-ico svg{stroke-width:3}
.np-fchip.on{background:#E9F1FF;box-shadow:inset 0 0 0 1.5px var(--np-blue);color:var(--np-ink)}
.np-fchip.on > i{background:var(--np-blue);box-shadow:none;color:#fff}
.np-btn-text.sm{height:auto;padding:0;font-size:calc(13px * var(--np-ts,1));text-transform:none;letter-spacing:0}
/* ═══ Karta towaru ═══ */
.np-pe{width:min(1120px,calc(100% - 24px));height:min(740px,calc(100% - 24px));padding:0;overflow:hidden}
.np-pe-head{flex:none;display:flex;align-items:center;gap:12px;height:66px;padding:0 20px 0 24px;border-bottom:1px solid var(--np-hair);background:var(--np-surface)}
.np-pe-title{flex:1;min-width:0}
.np-pe-title b{display:block;font-size:calc(22px * var(--np-ts,1));font-weight:650;letter-spacing:-.01em}
.np-pe-title small{display:block;font-size:calc(13.5px * var(--np-ts,1));color:var(--np-ink-2)}
.np-pe-head .np-pill-btn{height:40px}
.np-pe-body{padding:14px 16px 18px}
.np-pe-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.np-pe-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.np-pe-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;padding:14px;border-radius:var(--np-r-md);background:var(--np-surface);box-shadow:var(--np-shadow-1)}
.np-pe-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.np-pe-f.span{grid-column:1/-1}
.np-pe-l{display:flex;align-items:baseline;gap:6px;font-size:calc(12.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-pe-l em{font-style:normal;color:var(--np-ink-3);font-weight:500}
.np-pe-row{display:flex;gap:6px;min-width:0}
.np-pe-in{flex:1;min-width:0;height:46px;padding:0 12px;border:0;outline:0;border-radius:11px;background:var(--np-surface-2);font:inherit;font-size:calc(16.5px * var(--np-ts,1));color:var(--np-ink);box-shadow:inset 0 0 0 1px var(--np-hair);caret-color:var(--np-blue)}
.np-pe-in::placeholder{color:var(--np-ink-3)}
.np-pe-in.num{text-align:right;font-variant-numeric:tabular-nums}
.np-pe-in.big{height:54px;font-size:calc(24px * var(--np-ts,1));font-weight:650}
.np-pe-in.ro{color:var(--np-ink-2);background:transparent}
.np-pe-in.focus{background:#fff;box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-pe-in.err{box-shadow:inset 0 0 0 2px var(--np-red)}
.np-pe-in.area{height:auto;min-height:84px;padding:10px 12px;resize:none;line-height:1.35}
.np-pe-err{font-size:calc(13px * var(--np-ts,1));font-weight:550;color:var(--np-red)}
.np-pe-gen{flex:none;width:52px;border-radius:11px;background:var(--np-green);color:#fff;font-size:calc(20px * var(--np-ts,1));font-weight:700;letter-spacing:.05em}
.np-pe-gen:active{background:var(--np-green-700)}
.np-pe-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;padding:0 10px 0 12px;border-radius:11px;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(16px * var(--np-ts,1));font-weight:550;text-align:left;min-width:0}
.np-pe-sel > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-pe-sel .np-ico{width:18px;height:18px;color:var(--np-ink-3);flex:none}
.np-pe-sel.on{box-shadow:inset 0 0 0 2px var(--np-blue)}
.np-pe-step{display:flex;align-items:center;gap:0;height:46px;border-radius:11px;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair);align-self:flex-start}
.np-pe-step button{width:56px;height:46px;display:grid;place-items:center}
.np-pe-step button .np-ico{width:20px;height:20px}
.np-pe-step b{min-width:44px;text-align:center;font-size:calc(18px * var(--np-ts,1));font-variant-numeric:tabular-nums}
.np-pe-tot{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 12px;border-radius:11px;background:transparent;box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(15px * var(--np-ts,1));color:var(--np-ink-2);font-variant-numeric:tabular-nums}
.np-pe-tot b{color:var(--np-ink)}
.np-pe-descs{display:flex;flex-direction:column;gap:6px}
.np-pe-descs .np-pe-in{height:40px;font-size:calc(15px * var(--np-ts,1))}
.np-pe-osk{flex:none;padding:8px;border-top:1px solid var(--np-hair);background:#E9EBEE}
.np-pe-osk .np-osk{animation:none;padding:0;background:transparent}
.np-pe-foot{flex:none;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px;border-top:1px solid var(--np-hair);background:var(--np-surface)}
.np-pe-foot .np-btn{height:58px}
.np-pe-pick{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(18,20,24,.28);border-radius:inherit}
.np-pe-pickbox{width:min(460px,calc(100% - 40px));max-height:calc(100% - 60px);display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:#F6F7F9;box-shadow:var(--np-shadow-3)}
.np-pe-pickhead{display:flex;align-items:center;justify-content:space-between}
.np-pe-pickhead b{font-size:calc(19px * var(--np-ts,1));font-weight:650}
.np-pe-pickbox .np-sa{max-height:520px}
.np-pe-pickbox .np-choices{margin-top:0}
.np-pe-gen{display:flex;align-items:center;justify-content:center;gap:4px}
.np-pe-gen > i{width:5px;height:5px;border-radius:50%;background:#fff}
.np-pe-osk.num{display:grid;grid-template-columns:minmax(0,1fr) 360px 160px;gap:12px;align-items:stretch;height:250px;padding:10px 16px}
.np-pe-osk.num .np-numpad{gap:6px}
.np-pe-osk.num .np-nk{font-size:calc(26px * var(--np-ts,1))}
.np-pe-osk.num > .np-btn{height:auto}
.np-pe-numl{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding-left:8px}
.np-pe-numl b{font-size:calc(14px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2)}
.np-pe-numl span{font-size:calc(34px * var(--np-ts,1));font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* − / + : „pigułka w pigułce” — strefa dotyku nadal cała kolumna, wizualnie kapsuła wewnątrz zaokrąglonej pozycji */
.np-qb-in{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit}
.qs-pill .np-line.qb{grid-template-columns:58px minmax(0,1fr) 58px;padding:6px;border-radius:22px;min-height:72px}
.qs-pill .np-line-wrap{border-radius:22px}
.qs-pill .np-qb{background:none;box-shadow:none!important;border-radius:0;padding:0;color:var(--np-ink)}
.qs-pill .np-qb-in{border-radius:999px;background:var(--np-surface);box-shadow:0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06);transition:transform .1s,background .1s}
.qs-pill .np-qb .np-ico{width:24px;height:24px}
.qs-pill .np-qb .np-ico svg{stroke-width:2.4}
.qs-pill .np-qb:active .np-qb-in{transform:scale(.92);background:#E6E8EC}
.qs-pill .np-qb.plus .np-qb-in{background:var(--np-ink);color:#fff;box-shadow:none}
.qs-pill .np-qb.plus:active .np-qb-in{background:#33353A}
.qs-pill .np-qb.del .np-qb-in{background:#FFE9E3;color:var(--np-red);box-shadow:none}
.qs-pill .np-line-body{padding:4px 10px}
.qs-pill .np-line.sel .np-qb{background:none}
.qs-pill .np-line.sel .np-qb-in{box-shadow:0 0 0 1.5px rgba(10,124,255,.35)}
.qs-pill .np-line.sel .np-qb.plus .np-qb-in{box-shadow:none}
/* dopracowanie: pionowe kapsuły, spokojniejszy kolor (bez ciemnych kół i czerwonych koszy w każdym wierszu) */
.qs-pill .np-qb{display:flex;align-items:stretch;justify-content:center}
.qs-pill .np-qb-in{width:46px;height:auto;min-height:48px}
.qs-pill .np-qb.plus .np-qb-in{background:var(--np-surface);color:var(--np-ink);box-shadow:0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06)}
.qs-pill .np-qb.plus .np-ico svg{stroke-width:2.6}
.qs-pill .np-qb.plus:active .np-qb-in{background:#DFF5E9;color:#0E7440}
.qs-pill .np-qb.del .np-qb-in{background:var(--np-surface);color:var(--np-ink-3);box-shadow:0 1px 2px rgba(16,18,22,.08),0 0 0 .5px rgba(16,18,22,.06)}
.qs-pill .np-qb.del:active .np-qb-in{background:#FFE9E3;color:var(--np-red)}
.qs-pill .np-qb:not(.plus):not(.del) .np-ico{color:var(--np-ink-2)}
.qs-pill .np-qb.del .np-qb-in{background:#FFE9E3;color:var(--np-red);box-shadow:none}
.qs-pill .np-qb.del:active .np-qb-in{background:#FFD3C7;color:var(--np-red)}
/* Rabat / narzut na paragon */
.np-total-label{align-items:flex-start}
.np-docadj-btn{display:inline-flex;align-items:center;gap:5px;height:30px;margin-top:8px;padding:0 11px 0 8px;border-radius:999px;background:var(--np-surface-2);box-shadow:inset 0 0 0 1px var(--np-hair);font-size:calc(13.5px * var(--np-ts,1));font-weight:600;color:var(--np-ink-2);white-space:nowrap}
.np-docadj-btn .np-ico{width:15px;height:15px}
.np-docadj-btn.on{background:#FFE9E3;color:var(--np-red);box-shadow:none}
.np-docadj-btn:active{transform:scale(.96)}
.np-sum-disc.up b{color:var(--np-orange)}
.np-docadj{width:min(860px,calc(100% - 24px));padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
.np-docadj-l{display:flex;flex-direction:column;gap:12px;min-width:0}
